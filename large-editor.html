<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quantumult X 大文件 List 编辑器</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#17212f;--muted:#687385;--line:#dbe1e8;--blue:#0969da;--red:#b42318;--green:#08793f}@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#18202a;--text:#edf2f7;--muted:#a9b5c4;--line:#35414f;--blue:#78b5ff;--red:#ff948c;--green:#77d49a}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:1440px;margin:auto;padding:16px}.top,.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;align-items:flex-start;margin-bottom:14px}h1{margin:0;font-size:27px}.sub,.status,.tip{color:var(--muted)}.sub{margin:4px 0 0}.badge{border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px}.settings{padding:13px;display:grid;grid-template-columns:1fr 150px;gap:9px}.tokenrow{padding:0 13px 13px;display:grid;grid-template-columns:1fr auto;gap:9px;align-items:end}label{display:grid;gap:5px;color:var(--muted);font-size:13px}input,textarea{width:100%;padding:9px 10px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:9px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}.btn{padding:8px 11px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:9px;font-weight:650;cursor:pointer}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{color:#fff;filter:brightness(.94)}.status{font-size:13px;min-height:20px}.ok{color:var(--green)}.bad{color:var(--red)}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:13px;margin-top:13px}.side{padding:13px;min-height:610px}.side h2,.head h2{font-size:15px;margin:0}.files{display:grid;gap:5px;margin-top:10px;max-height:420px;overflow:auto}.file{background:transparent;border:1px solid transparent;border-radius:8px;color:var(--text);padding:8px;text-align:left;overflow-wrap:anywhere;cursor:pointer}.file:hover,.file.active{background:color-mix(in srgb,var(--blue) 10%,transparent);border-color:color-mix(in srgb,var(--blue) 28%,var(--line))}.tip{background:color-mix(in srgb,var(--blue) 8%,transparent);border-radius:10px;margin-top:13px;padding:10px;font-size:13px}.editor{min-height:610px;overflow:hidden}.head{padding:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toolbar{padding:10px 13px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}.toolbar input{min-width:180px;flex:1 1 220px}.area{padding:12px}textarea{display:block;min-height:530px;resize:vertical;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;white-space:pre;tab-size:2}.issues{display:none;border-top:1px solid var(--line);padding:10px 13px;max-height:160px;overflow:auto}.issues.show{display:block}.issue{padding:6px 8px;margin:3px 0;border-radius:7px;background:color-mix(in srgb,var(--red) 13%,transparent);font:12px/1.4 ui-monospace,monospace;cursor:pointer}.warn{background:#fff3c9;color:#6d4900}.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:calc(100vw - 28px);background:#17212f;color:#fff;padding:10px 14px;border-radius:999px;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:840px){.app{padding:11px}.settings,.tokenrow,.layout{grid-template-columns:1fr}.side,.editor{min-height:0}.files{max-height:215px}textarea{min-height:430px}h1{font-size:23px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><h1>Quantumult X 大文件 List 编辑器</h1><p class="sub">使用 raw 文件地址读取，避免 GitHub Contents API 对大文件不返回正文的问题。</p></div><span id="dirty" class="badge">未加载文件</span></header>
<section class="card"><div class="settings"><label>规则仓库<input id="repo" value="clxmhcs/quantumult-X-fenliu" placeholder="用户名/仓库名或 GitHub URL" spellcheck="false"></label><label>分支<input id="branch" value="" placeholder="留空自动识别" spellcheck="false"></label></div><div class="tokenrow"><label>GitHub Fine-grained Personal Access Token（私有仓库或保存时需要；仅停留在当前页面内存）<input id="token" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false"></label><div class="row"><button id="read" class="btn primary" type="button">读取规则文件</button><button id="clearToken" class="btn" type="button">清除 Token</button></div></div><div class="row" style="padding:0 13px 13px"><span id="status" class="status"></span></div></section>
<section class="layout"><aside class="card side"><h2>规则文件</h2><div id="files" class="files"><div class="status">点击“读取规则文件”</div></div><div class="tip">大于 1 MB 的文件会从 raw.githubusercontent.com 读取。10 MB 左右的文件在手机上首次载入、搜索和统计可能需要数秒。</div></aside><section class="card editor"><div class="head"><div><h2 id="path">尚未选择文件</h2><div id="meta" class="status"></div></div><div class="row"><button id="download" class="btn" type="button">下载 .list</button><button id="save" class="btn primary" type="button">保存到 GitHub</button></div></div><div class="toolbar"><input id="search" placeholder="查找域名、策略或规则" spellcheck="false"><button id="find" class="btn" type="button">下一个</button><button id="add" class="btn" type="button">新增规则</button><button id="format" class="btn" type="button">整理格式</button><button id="dedupe" class="btn" type="button">规则去重</button><button id="header" class="btn" type="button">更新统计</button><button id="check" class="btn" type="button">校验</button></div><div class="area"><textarea id="editor" disabled spellcheck="false" wrap="off"></textarea></div><div id="issues" class="issues"></div></section></section>
</main><div id="toast" class="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id),e={repo:$("repo"),branch:$("branch"),token:$("token"),read:$("read"),clearToken:$("clearToken"),files:$("files"),path:$("path"),meta:$("meta"),dirty:$("dirty"),status:$("status"),editor:$("editor"),search:$("search"),find:$("find"),add:$("add"),format:$("format"),dedupe:$("dedupe"),header:$("header"),check:$("check"),download:$("download"),save:$("save"),issues:$("issues"),toast:$("toast")};
const s={files:[],path:"",sha:"",original:"",size:0,repo:"",branch:"",find:0,timer:0};
const known=new Set(["HOST","HOST-SUFFIX","HOST-KEYWORD","HOST-WILDCARD","IP-CIDR","IP6-CIDR","GEOIP","USER-AGENT","URL-REGEX","PROCESS-NAME","PROCESS-PATH","FINAL","AND","OR","NOT"]),heads=new Set(["HOST","HOST-SUFFIX","HOST-KEYWORD","HOST-WILDCARD","IP-CIDR","IP6-CIDR","USER-AGENT","TOTAL"]);
const text=v=>String(v||"").replace(/\r\n/g,"\n"),repo=()=>e.repo.value.trim().replace(/^https?:\/\/(?:www\.)?github\.com\//i,"").replace(/\.git\/?$/i,"").replace(/^\/+|\/+$/g,"").split("/").slice(0,2).join("/"),branch=()=>s.branch||e.branch.value.trim(),safe=p=>p.split("/").map(encodeURIComponent).join("/"),apiFor=(r,p)=>`https://api.github.com/repos/${r}/${p}`,api=p=>apiFor(s.repo||repo(),p),raw=p=>`https://raw.githubusercontent.com/${s.repo}/${safe(s.branch)}/${safe(p)}`,rule=l=>l.trim()&&!l.trimStart().startsWith("#"),parts=l=>l.split(",").map(x=>x.trim());
function auth(){const h={Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};if(e.token.value.trim())h.Authorization=`Bearer ${e.token.value.trim()}`;return h}function toast(v){clearTimeout(s.timer);e.toast.textContent=v;e.toast.className="toast show";s.timer=setTimeout(()=>e.toast.className="toast",3200)}function status(v,k=""){e.status.textContent=v;e.status.className=`status ${k}`}function bytes(n){if(n<1024*1024)return `${Math.round(n/1024)} KB`;return `${(n/1024/1024).toFixed(1)} MB`}function b64in(v){const x=atob(v.replace(/\n/g,""));return new TextDecoder().decode(Uint8Array.from(x,c=>c.charCodeAt(0)))}function b64out(v){let x="";for(const n of new TextEncoder().encode(v))x+=String.fromCharCode(n);return btoa(x)}async function json(url,opt={}){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||`GitHub 请求失败（${r.status}）`);return d}async function rawText(path){const token=e.token.value.trim(),r=token?await fetch(api(`contents/${safe(path)}?ref=${encodeURIComponent(s.branch)}`),{headers:{...auth(),Accept:"application/vnd.github.raw+json"}}):await fetch(raw(path));if(!r.ok)throw new Error(`原始文件读取失败（${r.status}）`);return r.text()}function count(v){let total=0;const c={};for(const l of text(v).split("\n")){if(!rule(l))continue;const t=(parts(l)[0]||"").toUpperCase();c[t]=(c[t]||0)+1;total++}return {total,c}}function refresh(){e.dirty.textContent=!s.path?"未加载文件":e.editor.value===s.original?"已同步":"有未保存修改"}function norm(l){return rule(l)?parts(l).join(","):l.replace(/[ \t]+$/g,"")}function render(){if(!s.files.length){e.files.innerHTML='<div class="status">未找到 .list 文件</div>';return}e.files.innerHTML="";for(const f of s.files){const b=document.createElement("button");b.className=`file${f.path===s.path?" active":""}`;b.textContent=f.path;b.onclick=()=>loadFile(f.path);e.files.appendChild(b)}}
async function readFiles(){const target=repo();if(!/^[^/\s]+\/[^/\s]+$/.test(target)){status("仓库格式应为 用户名/仓库名 或完整 GitHub URL","bad");return}if(s.path&&e.editor.value!==s.original&&!confirm("当前文件有未保存修改。仍然读取其它仓库吗？"))return;status(`正在读取 ${target} 的 .list 文件…`);try{let targetBranch=e.branch.value.trim();if(!targetBranch){const info=await json(apiFor(target,""),{headers:auth()});targetBranch=String(info.default_branch||"");if(!targetBranch)throw new Error("无法识别仓库默认分支")}const d=await json(apiFor(target,`git/trees/${encodeURIComponent(targetBranch)}?recursive=1`),{headers:auth()});s.repo=target;s.branch=targetBranch;e.repo.value=target;e.branch.value=targetBranch;s.path="";s.sha="";s.original="";s.files=(d.tree||[]).filter(x=>x.type==="blob"&&/\.list$/i.test(x.path)).sort((a,b)=>a.path.localeCompare(b.path,"zh-CN"));render();status(`在 ${target}@${targetBranch} 找到 ${s.files.length} 个 .list 文件`,"ok");if(s.files.length){const f=s.files.find(x=>/(^|\/)Apple\.list$/i.test(x.path))||s.files[0];await loadFile(f.path)}}catch(err){status(err.message,"bad")}}
async function loadFile(path){if(s.path&&e.editor.value!==s.original&&!confirm("当前文件有未保存修改。仍然切换吗？"))return;status(`正在读取 ${path}…`);e.editor.disabled=true;try{const meta=await json(api(`contents/${safe(path)}?ref=${encodeURIComponent(s.branch)}`),{headers:auth()});s.path=path;s.sha=meta.sha;s.size=meta.size||0;e.path.textContent=path;e.meta.textContent=`正在下载 ${bytes(s.size)}…`;const value=meta.content?b64in(meta.content):await rawText(path);s.original=value;e.editor.value=value;e.editor.disabled=false;e.meta.textContent=`${s.repo}@${s.branch} · ${bytes(s.size)} · ${value.split("\n").length.toLocaleString()} 行`;e.issues.className="issues";render();refresh();status("文件已加载","ok")}catch(err){e.editor.disabled=false;status(err.message,"bad");e.meta.textContent="读取失败：可能是网络、权限或跨域限制"}}
function dateTime(){const d=new Date(),p=x=>String(x).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}function format(){const end=/\n$/.test(e.editor.value);let v=text(e.editor.value).split("\n").map(norm).join("\n");if(!end)v=v.replace(/\n$/,"");e.editor.value=v;refresh();toast("已整理规则格式")}function dedupe(){const seen=new Set();let n=0;e.editor.value=text(e.editor.value).split("\n").filter(l=>{if(!rule(l))return true;const k=norm(l);if(seen.has(k)){n++;return false}seen.add(k);return true}).join("\n");refresh();toast(n?`已移除 ${n} 条重复规则`:"没有完全重复的规则")}function updateHeader(){status("正在统计全部规则…");setTimeout(()=>{const z=count(e.editor.value),c=z.c;let hit=false;e.editor.value=text(e.editor.value).split("\n").map(l=>{let m=l.match(/^(#\s*UPDATED\s*:\s*).*/i);if(m){hit=true;return m[1]+dateTime()}m=l.match(/^#\s*([A-Z0-9-]+)\s*:\s*\d+\s*$/i);if(m&&heads.has(m[1].toUpperCase())){hit=true;const n=m[1].toUpperCase();return `# ${n}: ${n==="TOTAL"?z.total:(c[n]||0)}`}return l}).join("\n");refresh();status("统计已完成","ok");toast(hit?"已更新现有头部统计":"当前文件没有可更新的统计头部")},30)}function gotoLine(n){const a=e.editor.value.split("\n"),st=a.slice(0,Math.max(0,n-1)).join("\n").length+(n>1?1:0);e.editor.focus();e.editor.setSelectionRange(st,st+(a[n-1]||"").length)}function check(){status("正在校验…");setTimeout(()=>{const list=[];text(e.editor.value).split("\n").forEach((l,i)=>{if(!rule(l))return;const p=parts(l),t=(p[0]||"").toUpperCase();if(!known.has(t))list.push(["warn",i+1,`未识别类型 ${t||"(空)"}`]);if(p.length<2||!p[1])list.push(["bad",i+1,"缺少匹配内容或策略"]);if(t!=="FINAL"&&p.length<3)list.push(["bad",i+1,"缺少策略组 / 动作"])});if(!list.length){e.issues.innerHTML='<div class="issue" style="background:color-mix(in srgb,var(--green) 15%,transparent);cursor:default">校验通过：未发现基础格式问题。</div>';e.issues.className="issues show";status("校验通过","ok");return}e.issues.innerHTML=list.slice(0,500).map(x=>`<div class="issue ${x[0]==="warn"?"warn":""}" data-line="${x[1]}">第 ${x[1]} 行：${x[2]}</div>`).join("")+(list.length>500?`<div class="issue">仅显示前 500 项，共 ${list.length} 项。</div>`:"");e.issues.className="issues show";e.issues.querySelectorAll("[data-line]").forEach(x=>x.onclick=()=>gotoLine(+x.dataset.line));status(`发现 ${list.length} 个待检查项`,"bad")},30)}function find(){const q=e.search.value.trim();if(!q){e.search.focus();return}const all=e.editor.value.toLowerCase(),n=q.toLowerCase();let at=all.indexOf(n,Math.max(0,e.editor.selectionEnd||s.find));if(at<0)at=all.indexOf(n);if(at<0){toast("没有找到匹配内容");return}e.editor.focus();e.editor.setSelectionRange(at,at+q.length);s.find=at+q.length}function add(){if(!s.path){toast("请先加载一个文件");return}const t=(prompt("规则类型：","HOST")||"").trim().toUpperCase(),v=(prompt("匹配内容：","apps.apple.com")||"").trim(),p=(prompt("策略组 / 动作：","Apple")||"").trim();if(!t||!v||!p)return;e.editor.value=e.editor.value.replace(/\s*$/,"")+(e.editor.value.trim()?"\n":"")+`${t},${v},${p}\n`;refresh()}function download(){const name=s.path?s.path.split("/").pop():"QuantumultX.list",u=URL.createObjectURL(new Blob([text(e.editor.value)],{type:"text/plain;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function save(){if(!s.path){toast("请先加载一个文件");return}if(!e.token.value.trim()){toast("保存需要填写 GitHub Token");e.token.focus();return}if(s.size>90*1024*1024){toast("文件过大，建议使用 GitHub Desktop 或 git 提交");return}try{status("正在检查远程文件…");const p=safe(s.path),latest=await json(api(`contents/${p}?ref=${encodeURIComponent(branch())}`),{headers:auth()});if(latest.sha!==s.sha&&!confirm("远程文件已经变化，是否覆盖远程版本？")){status("已取消保存");return}status("正在编码并提交大文件，请勿离开页面…");const d=await json(api(`contents/${p}`),{method:"PUT",headers:{...auth(),"Content-Type":"application/json"},body:JSON.stringify({message:`编辑 ${s.path}`,content:b64out(text(e.editor.value)),branch:branch(),sha:latest.sha})});s.sha=d.content?.sha||latest.sha;s.original=e.editor.value;refresh();status("已保存到 GitHub","ok");toast("保存成功；Quantumult X 更新资源后即可获取新规则")}catch(err){status(err.message,"bad");toast("保存失败，请检查 Token 权限或网络")}}
e.read.onclick=readFiles;e.clearToken.onclick=()=>{e.token.value="";toast("Token 已清除")};e.format.onclick=format;e.dedupe.onclick=dedupe;e.header.onclick=updateHeader;e.check.onclick=check;e.find.onclick=find;e.add.onclick=add;e.download.onclick=download;e.save.onclick=save;e.editor.oninput=refresh;e.search.onkeydown=x=>{if(x.key==="Enter")find()};e.editor.onkeydown=x=>{if(x.key==="Tab"){x.preventDefault();e.editor.setRangeText("  ",e.editor.selectionStart,e.editor.selectionEnd,"end");refresh()}if((x.metaKey||x.ctrlKey)&&x.key.toLowerCase()==="s"){x.preventDefault();save()}};window.onbeforeunload=x=>{if(s.path&&e.editor.value!==s.original){x.preventDefault();x.returnValue=""}};refresh();
})();
</script>
</body>
