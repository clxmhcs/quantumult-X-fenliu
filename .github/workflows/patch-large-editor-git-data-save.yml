name: Finalize large editor Git Data save

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-large-editor-git-data-save.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove post-save UTF-8 allocation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('large-editor.html')
          s = p.read_text()
          old = 's.size=new TextEncoder().encode(bodySnapshot).length'
          new = 's.size=new Blob([bodySnapshot]).size'
          if s.count(old) != 1:
              raise SystemExit(f'size anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          script = s.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/large-editor.js').write_text(script)
          PY
          node --check /tmp/large-editor.js
          git diff --check
          ! grep -q 'new TextEncoder().encode(bodySnapshot)' large-editor.html
          grep -q 's.size=new Blob(\[bodySnapshot\]).size' large-editor.html
          ! grep -q 'function b64out' large-editor.html
          grep -q 'git/blobs' large-editor.html
          grep -q 'force:false' large-editor.html
          git diff -- large-editor.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add large-editor.html
          git commit -m 'Avoid post-save UTF-8 allocation'
          git push origin HEAD:main
