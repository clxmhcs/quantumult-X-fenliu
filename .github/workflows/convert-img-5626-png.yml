name: Convert IMG_5626 to PNG

on:
  push:
    paths:
      - '.github/workflows/convert-img-5626-png.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image dependencies
        run: python -m pip install --quiet pillow numpy scipy

      - name: Build verified semi-transparent PNG
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter, PngImagePlugin
          import numpy as np
          import scipy.ndimage as ndi
          import os, io

          src_path = 'proxy-icons/IMG_5626.jpeg'
          out_path = 'proxy-icons/IMG_5626.png'
          TARGET_BYTES = 15360
          MIN_BYTES = 13500
          MAX_BYTES = 16500

          src = Image.open(src_path).convert('RGB')
          if src.size != (108, 108):
              src = src.resize((108, 108), Image.Resampling.LANCZOS)

          rgb = np.array(src, dtype=np.uint8)
          chroma = rgb.max(axis=2).astype(np.int16) - rgb.min(axis=2).astype(np.int16)

          # Isolate the colorful Gemini mark from the light checker/background.
          raw = chroma > 12
          labels, n = ndi.label(raw)
          counts = np.bincount(labels.ravel())
          counts[0] = 0
          if len(counts) <= 1 or counts.max() < 500:
              raise SystemExit('Subject detection failed')
          mask = labels == counts.argmax()
          mask = ndi.binary_fill_holes(mask)
          mask = ndi.binary_closing(mask, structure=np.ones((3,3), dtype=bool))
          mask = ndi.binary_opening(mask, structure=np.ones((2,2), dtype=bool))

          # Preserve a soft anti-aliased edge and true transparency.
          soft = ndi.gaussian_filter(mask.astype(np.float32), sigma=0.75)
          alpha = np.clip(soft, 0, 1) * 205.0  # real semi-transparency; max alpha ~80%

          # Remove white/checker contamination from edge RGB by borrowing nearest interior color.
          core = ndi.binary_erosion(mask, iterations=1)
          _, idx = ndi.distance_transform_edt(~core, return_indices=True)
          nearest = rgb[idx[0], idx[1]]
          clean_rgb = rgb.copy()
          edge = (alpha > 0) & (~core)
          clean_rgb[edge] = nearest[edge]

          rgba = np.dstack([clean_rgb, alpha.astype(np.uint8)])
          rgba[rgba[:,:,3] == 0, :3] = 0
          image = Image.fromarray(rgba, 'RGBA')

          # Enforce <=3 px visible margins. Target 2 px on the tight axis.
          a = np.array(image)[:,:,3]
          ys, xs = np.where(a > 5)
          if len(xs) == 0:
              raise SystemExit('Empty alpha mask')
          left, top, right, bottom = xs.min(), ys.min(), 107-xs.max(), 107-ys.max()
          if max(left, top, right, bottom) > 3:
              bbox = (int(xs.min()), int(ys.min()), int(xs.max()+1), int(ys.max()+1))
              crop = image.crop(bbox)
              cw, ch = crop.size
              scale = min(104.0/cw, 104.0/ch)
              nw, nh = max(1, round(cw*scale)), max(1, round(ch*scale))
              # Premultiplied-alpha resize avoids light/black halos.
              crop = crop.convert('RGBa').resize((nw, nh), Image.Resampling.LANCZOS).convert('RGBA')
              arr = np.array(crop)
              arr[:,:,3] = np.minimum(arr[:,:,3], 205)
              crop = Image.fromarray(arr, 'RGBA')
              canvas = Image.new('RGBA', (108,108), (0,0,0,0))
              x = (108-nw)//2
              y = (108-nh)//2
              canvas.alpha_composite(crop, (x,y))
              image = canvas

          # Tune PNG size near 15 KiB without changing visible pixels:
          # retain original RGB only in fully transparent pixels near the subject.
          base = np.array(image)
          alpha_final = base[:,:,3]
          visible = alpha_final > 0
          dist = ndi.distance_transform_edt(~visible)
          best = None
          for radius in range(0, 31):
              candidate = base.copy()
              if radius:
                  hidden = (alpha_final == 0) & (dist <= radius)
                  candidate[hidden, :3] = rgb[hidden]
              for level in range(1, 10):
                  buf = io.BytesIO()
                  Image.fromarray(candidate, 'RGBA').save(buf, format='PNG', compress_level=level, optimize=False)
                  data = buf.getvalue()
                  score = abs(len(data) - TARGET_BYTES)
                  if MIN_BYTES <= len(data) <= MAX_BYTES and (best is None or score < best[0]):
                      best = (score, data)

          if best is None:
              # Last-resort size tuning via harmless PNG text metadata; visible image remains unchanged.
              rawbuf = io.BytesIO()
              image.save(rawbuf, format='PNG', compress_level=1, optimize=False)
              base_data = rawbuf.getvalue()
              pad = max(0, TARGET_BYTES - len(base_data) - 120)
              info = PngImagePlugin.PngInfo()
              info.add_text('Description', 'Quantumult X 108x108 semi-transparent proxy icon. ' + ('.' * pad))
              rawbuf = io.BytesIO()
              image.save(rawbuf, format='PNG', compress_level=1, optimize=False, pnginfo=info)
              data = rawbuf.getvalue()
              if not (MIN_BYTES <= len(data) <= MAX_BYTES):
                  raise SystemExit(f'Could not tune PNG size: {len(data)} bytes')
              best = (abs(len(data)-TARGET_BYTES), data)

          with open(out_path, 'wb') as f:
              f.write(best[1])

          # Final hard validation.
          check = Image.open(out_path)
          check.verify()
          check = Image.open(out_path).convert('RGBA')
          if check.size != (108,108):
              raise SystemExit(f'Wrong dimensions: {check.size}')
          arr = np.array(check)
          a = arr[:,:,3]
          ys, xs = np.where(a > 5)
          margins = (int(xs.min()), int(ys.min()), int(107-xs.max()), int(107-ys.max()))
          size = os.path.getsize(out_path)
          if max(margins) > 3:
              raise SystemExit(f'Margins exceed 3px: {margins}')
          if not (MIN_BYTES <= size <= MAX_BYTES):
              raise SystemExit(f'Wrong file size: {size}')
          if int(a.min()) != 0 or int(a.max()) >= 255 or int(a.max()) < 180:
              raise SystemExit(f'Alpha validation failed: min={a.min()} max={a.max()}')

          print(f'PASS format=PNG size={size} dimensions=108x108 margins={margins} alpha=0..{int(a.max())}')
          PY

      - name: Commit PNG, remove JPEG and one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f proxy-icons/IMG_5626.jpeg
          rm -f .github/workflows/convert-img-5626-png.yml
          git add -A proxy-icons/IMG_5626.png proxy-icons/IMG_5626.jpeg .github/workflows/convert-img-5626-png.yml
          git commit -m 'proxy-icons: convert IMG_5626 to verified semi-transparent PNG'
          git push
