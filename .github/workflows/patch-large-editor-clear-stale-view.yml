name: Patch large editor stale view cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-large-editor-clear-stale-view.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch stale loaded view handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('large-editor.html')
          s=p.read_text()
          marker='function targetChanged(announce=true)'
          if s.count(marker)!=1: raise SystemExit(f'target marker={s.count(marker)}')
          helper='function clearLoadedView(metaText="",clearFiles=false){s.lineCountSeq++;s.path="";s.sha="";s.original="";s.size=0;s.dirty=false;s.revision=0;s.find=0;if(clearFiles)s.files=[];e.path.textContent="尚未选择文件";e.meta.textContent=metaText;e.editor.value="";e.editor.disabled=true;e.issues.innerHTML="";e.issues.className="issues";if(clearFiles)render();e.save.disabled=true;refresh()}\n'
          s=s.replace(marker,helper+marker,1)
          old='if(!s.path){e.save.disabled=s.saveBusy;return false}'
          if s.count(old)!=1: raise SystemExit(f'no-path save anchor={s.count(old)}')
          s=s.replace(old,'if(!s.path){e.save.disabled=true;return false}',1)
          pattern=r'async function readFiles\(\)\{.*?\nfunction scheduleLineCount'
          if len(list(re.finditer(pattern,s,re.S)))!=1: raise SystemExit('readFiles match failure')
          new_read='async function readFiles(){if(s.saveBusy){toast("正在保存，请完成后再切换仓库或分支");return}const target=repo();if(!/^[^/\\s]+\\/[^/\\s]+$/.test(target)){status("仓库格式应为 用户名/仓库名 或完整 GitHub URL","bad");return}if(s.path&&s.dirty&&!confirm("当前文件有未保存修改。仍然读取其它仓库吗？"))return;const requested=e.branch.value.trim();clearLoadedView("正在读取仓库…",true);status(requested?`正在读取 ${target}@${requested}…`:`正在读取 ${target} 并识别默认分支…`);try{const result=await readTree(target,requested),targetBranch=result.branch,d=result.data;s.repo=target;s.branch=targetBranch;s.readOnly=result.source==="jsdelivr";e.repo.value=target;e.branch.value=targetBranch;s.files=(d.tree||[]).filter(x=>x.type==="blob"&&/\\.list$/i.test(x.path)).sort((a,b)=>a.path.localeCompare(b.path,"zh-CN"));render();status(`在 ${target}@${targetBranch} 找到 ${s.files.length} 个 .list 文件${s.readOnly?" · 公共索引回退":""}`,"ok");if(s.files.length){const f=s.files.find(x=>/(^|\\/)Apple\\.list$/i.test(x.path))||s.files[0];await loadFile(f.path)}else{e.meta.textContent=`${target}@${targetBranch} · 未找到 .list 文件`;e.editor.disabled=true;e.save.disabled=true;refresh()}}catch(err){clearLoadedView("读取仓库失败",true);status(err.message,"bad")}}'
          s=re.sub(pattern,lambda m:new_read+'\nfunction scheduleLineCount',s,count=1,flags=re.S)
          p.write_text(s)
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/large-editor.js').write_text(script)
          PY
          node --check /tmp/large-editor.js
          git diff --check
          grep -q 'function clearLoadedView' large-editor.html
          grep -q 'clearLoadedView("正在读取仓库…",true)' large-editor.html
          grep -q 'clearLoadedView("读取仓库失败",true)' large-editor.html
          grep -q '未找到 .list 文件' large-editor.html
          grep -q 'if(!s.path){e.save.disabled=true;return false}' large-editor.html
          git diff -- large-editor.html
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- large-editor.html; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add large-editor.html
          git commit -m 'Clear stale editor state when switching repositories'
          git push origin HEAD:main
