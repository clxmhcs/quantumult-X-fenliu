name: Patch large editor tree and GitHub errors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-large-editor-tree-errors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch tree truncation and error classification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('large-editor.html')
          s=p.read_text()

          json_pattern=r'async function json\(url,opt=\{\}\)\{.*?\}async function rawText'
          if len(list(re.finditer(json_pattern,s,re.S)))!=1: raise SystemExit('json/rawText anchor failure')
          new_json='async function json(url,opt={}){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok){const x=new Error(d.message||`GitHub 请求失败（${r.status}）`);x.status=r.status;x.rateRemaining=r.headers.get("x-ratelimit-remaining");throw x}return d}function githubErrorLabel(x,hasToken=false){const code=Number(x?.status||0),msg=String(x?.message||"");if(code===403&&(x?.rateRemaining==="0"||/rate limit/i.test(msg)))return "GitHub API 请求次数已达上限";if(code===401)return "Token 无效或已过期";if(code===403)return hasToken?"Token 权限不足":"GitHub 拒绝访问";if(code===404)return hasToken?"仓库不存在，或 Token 无权访问":"仓库不存在或不可公开访问";if(x?.name==="TypeError"||/Failed to fetch|Load failed|NetworkError|network/i.test(msg))return `网络或连接错误${msg?`：${msg}`:""}`;return msg||`GitHub 请求失败${code?`（${code}）`:""}`}async function rawText'
          s=re.sub(json_pattern,lambda m:new_json,s,count=1,flags=re.S)

          load_pattern=r'async function loadRepositories\(\)\{.*?\}(?=\nasync function jsDelivrTree)'
          if len(list(re.finditer(load_pattern,s,re.S)))!=1: raise SystemExit('loadRepositories anchor failure')
          new_load='async function loadRepositories(){if(s.repoBusy)return;s.repoBusy=true;e.refreshRepos.disabled=true;status("正在加载仓库列表…");const owner=(repo().split("/")[0]||"clxmhcs"),token=e.token.value.trim();try{const url=token?"https://api.github.com/user/repos?per_page=100&sort=updated&affiliation=owner,collaborator,organization_member":`https://api.github.com/users/${encodeURIComponent(owner)}/repos?per_page=100&sort=updated&type=owner`,items=await json(url,{headers:auth()});if(!Array.isArray(items))throw new Error("GitHub 未返回仓库列表");s.repos=items.map(x=>({full_name:String(x.full_name||""),default_branch:String(x.default_branch||""),private:!!x.private})).filter(x=>x.full_name).sort((a,b)=>a.full_name.localeCompare(b.full_name,"zh-CN"));renderRepositories();status(`已加载 ${s.repos.length} 个${token?"可访问":"公开"}仓库；选择后自动读取`,"ok")}catch(x){renderRepositories();status(`仓库列表加载失败：${githubErrorLabel(x,!!token)}；继续使用内置公开仓库列表（${s.repos.length} 个）`,"bad")}finally{s.repoBusy=false;e.refreshRepos.disabled=false}}'
          s=re.sub(load_pattern,lambda m:new_load,s,count=1,flags=re.S)

          tree_pattern=r'async function readTree\(target,requested\)\{.*?\}(?=\nasync function readFiles)'
          if len(list(re.finditer(tree_pattern,s,re.S)))!=1: raise SystemExit('readTree anchor failure')
          new_tree='async function githubTree(target,candidate){const data=await json(apiFor(target,`git/trees/${encodeURIComponent(candidate)}?recursive=1`),{headers:auth()});if(data?.truncated){const x=new Error(`GitHub 返回的递归文件树已截断：${target}@${candidate}。为避免漏掉 .list 文件，已停止使用不完整结果`);x.code="TREE_TRUNCATED";throw x}return data}async function readTree(target,requested){const selected=s.repos.find(x=>x.full_name.toLowerCase()===target.toLowerCase()),canPublicFallback=!e.token.value.trim()&&(selected?.private===false||!selected);if(requested){let lastError=null;try{return {branch:requested,data:await githubTree(target,requested),source:"github"}}catch(x){lastError=x}if(canPublicFallback){try{return {branch:requested,data:await jsDelivrTree(target,requested),source:"jsdelivr"}}catch(x){if(lastError?.code!=="TREE_TRUNCATED")lastError=x}}const detail=lastError?.message&&lastError.message!=="Load failed"?`：${lastError.message}`:"";throw new Error(`无法读取指定分支 ${target}@${requested}${detail}。请检查分支名称或访问权限`)}const candidates=[];if(selected?.default_branch)candidates.push(selected.default_branch);let infoError=null;if(!selected?.default_branch){try{const info=await json(apiFor(target,""),{headers:auth()});if(info.default_branch)candidates.push(String(info.default_branch))}catch(x){infoError=x}}candidates.push("main","master");const unique=[...new Set(candidates.filter(Boolean))];let lastError=infoError,truncatedError=null;for(const candidate of unique){try{return {branch:candidate,data:await githubTree(target,candidate),source:"github"}}catch(x){lastError=x;if(x?.code==="TREE_TRUNCATED"){truncatedError=x;if(canPublicFallback){try{return {branch:candidate,data:await jsDelivrTree(target,candidate),source:"jsdelivr"}}catch(_){} }if(selected?.default_branch===candidate&&!canPublicFallback)break}}}if(canPublicFallback){for(const candidate of unique){try{return {branch:candidate,data:await jsDelivrTree(target,candidate),source:"jsdelivr"}}catch(x){lastError=x}}}if(truncatedError)lastError=truncatedError;const detail=lastError?.message&&lastError.message!=="Load failed"?`：${lastError.message}`:"";throw new Error(`无法读取 ${target} 或识别默认分支${detail}。私有仓库请填写 Token 后刷新仓库；公开仓库请稍后重试`)}'
          s=re.sub(tree_pattern,lambda m:new_tree,s,count=1,flags=re.S)

          p.write_text(s)
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/large-editor.js').write_text(script)
          PY
          node --check /tmp/large-editor.js
          git diff --check
          grep -q 'function githubErrorLabel' large-editor.html
          grep -q 'x.rateRemaining=r.headers.get' large-editor.html
          grep -q 'function githubTree' large-editor.html
          grep -q 'data?.truncated' large-editor.html
          grep -q 'TREE_TRUNCATED' large-editor.html
          grep -q '仓库列表加载失败' large-editor.html
          ! grep -q 'GitHub API 已限流，正在使用内置公开仓库列表' large-editor.html
          git diff -- large-editor.html
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- large-editor.html; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add large-editor.html
          git commit -m 'Detect truncated trees and classify GitHub errors'
          git push origin HEAD:main
