name: Fix iOS form focus zoom

on:
  push:
    paths:
      - '.github/workflows/fix-ios-input-zoom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile form-control font size
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('large-editor.html')
          s = p.read_text(encoding='utf-8')
          old = '@media(max-width:840px){.app{padding:11px}'
          new = '@media(max-width:840px){input,select,textarea{font-size:16px}.app{padding:11px}'
          if old not in s:
              raise SystemExit('expected CSS anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/fix-ios-input-zoom.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add large-editor.html
          git commit -m 'Fix iOS input focus zoom in large editor'
          git push
