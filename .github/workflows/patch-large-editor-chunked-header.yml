name: Patch large editor chunked header

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-large-editor-chunked-header.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch chunked header statistics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('large-editor.html')
          s = p.read_text()

          old_state = 'saveBusy:false,checkBusy:false,dirty:false'
          new_state = 'saveBusy:false,checkBusy:false,headerBusy:false,dirty:false'
          if s.count(old_state) != 1:
              raise SystemExit(f'state anchor count={s.count(old_state)}')
          s = s.replace(old_state, new_state, 1)

          old_count = 'function count(v){let total=0;const c={};for(const l of text(v).split("\\n")){if(!rule(l))continue;const t=(parts(l)[0]||"").toUpperCase();c[t]=(c[t]||0)+1;total++}return {total,c}}'
          if s.count(old_count) != 1:
              raise SystemExit(f'count anchor count={s.count(old_count)}')
          s = s.replace(old_count, '', 1)

          start = s.find('function updateHeader(){')
          end = s.find('function gotoLine(n){', start)
          if start < 0 or end < 0:
              raise SystemExit(f'updateHeader anchors start={start} end={end}')
          old_header = s[start:end]
          if old_header.count('function updateHeader(){') != 1:
              raise SystemExit('unexpected updateHeader block')

          new_header = '''function updateHeader(){if(s.headerBusy)return;const source=e.editor.value,headerRevision=s.revision,headerRepo=s.repo,headerBranch=s.branch,headerPath=s.path,c={},patches=[];let total=0,pos=0,lineNo=1,scanned=0;s.headerBusy=true;e.header.disabled=true;status("正在统计全部规则…");const done=()=>{s.headerBusy=false;e.header.disabled=false;if(s.repo!==headerRepo||s.branch!==headerBranch||s.path!==headerPath||s.revision!==headerRevision){status("内容已变化，已丢弃过期统计结果","bad");return}if(!patches.length){refresh();status("统计已完成","ok");toast("当前文件没有可更新的统计头部");return}const stamp=dateTime(),changed=[];for(const x of patches){const replacement=x.kind==="updated"?x.prefix+stamp:`# ${x.type}: ${x.type==="TOTAL"?total:(c[x.type]||0)}`;if(source.slice(x.start,x.end)!==replacement)changed.push({...x,replacement})}if(!changed.length){refresh();status("统计已完成","ok");toast("统计头部已是最新");return}const out=[];let at=0;for(const x of changed){out.push(source.slice(at,x.start),x.replacement);at=x.end}out.push(source.slice(at));e.editor.value=out.join("");markDirty();status("统计已完成","ok");toast("已更新现有头部统计")};const batch=()=>{const deadline=performance.now()+12;while(pos<=source.length&&performance.now()<deadline){const nl=source.indexOf("\\n",pos),end=nl<0?source.length:nl,l=source.slice(pos,end);if(rule(l)){const t=(parts(l)[0]||"").toUpperCase();c[t]=(c[t]||0)+1;total++}else{let m=l.match(/^(#\\s*UPDATED\\s*:\\s*).*/i);if(m)patches.push({start:pos,end,kind:"updated",prefix:m[1]});else{m=l.match(/^#\\s*([A-Z0-9-]+)\\s*:\\s*\\d+\\s*$/i);if(m){const type=m[1].toUpperCase();if(heads.has(type))patches.push({start:pos,end,kind:"count",type})}}}scanned++;if(nl<0){pos=source.length+1;break}pos=nl+1;lineNo++}if(pos<=source.length){status(`正在统计全部规则…已扫描 ${scanned.toLocaleString()} 行`);setTimeout(batch,0)}else done()};setTimeout(batch,0)}'''
          s = s[:start] + new_header + s[end:]

          p.write_text(s)
          script = s.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/large-editor.js').write_text(script)
          PY
          node --check /tmp/large-editor.js
          git diff --check
          ! grep -q 'function count(v)' large-editor.html
          grep -q 'headerBusy:false' large-editor.html
          grep -q 'performance.now()+12' large-editor.html
          grep -q '已丢弃过期统计结果' large-editor.html
          grep -q 'out.push(source.slice(at,x.start),x.replacement)' large-editor.html
          git diff -- large-editor.html
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- large-editor.html; then
            echo 'No change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add large-editor.html
          git commit -m 'Chunk large editor header statistics'
          git push origin HEAD:main
