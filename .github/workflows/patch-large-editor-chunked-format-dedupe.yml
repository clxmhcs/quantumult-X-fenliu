name: Patch large editor chunked format dedupe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-large-editor-chunked-format-dedupe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch chunked format and dedupe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          p = Path('large-editor.html')
          s = p.read_text()

          old_state = 'saveBusy:false,checkBusy:false,headerBusy:false,dirty:false'
          new_state = 'saveBusy:false,checkBusy:false,headerBusy:false,formatBusy:false,dedupeBusy:false,dirty:false'
          if s.count(old_state) != 1:
              raise SystemExit(f'state anchor count={s.count(old_state)}')
          s = s.replace(old_state, new_state, 1)

          new_funcs = textwrap.dedent(r'''
          function format(){
          if(s.formatBusy||s.dedupeBusy)return;
          const source=e.editor.value,formatRevision=s.revision,formatRepo=s.repo,formatBranch=s.branch,formatPath=s.path,patches=[];let pos=0,scanned=0;
          s.formatBusy=true;e.format.disabled=true;e.dedupe.disabled=true;status("正在整理规则格式…");
          const done=()=>{s.formatBusy=false;e.format.disabled=false;e.dedupe.disabled=false;if(s.repo!==formatRepo||s.branch!==formatBranch||s.path!==formatPath||s.revision!==formatRevision){status("内容已变化，已丢弃过期格式整理结果","bad");return}if(!patches.length){refresh();status("格式整理已完成","ok");toast("规则格式无需调整");return}const out=[];let at=0;for(const x of patches){out.push(source.slice(at,x.start),x.replacement);at=x.end}out.push(source.slice(at));e.editor.value=out.join("");markDirty();status("格式整理已完成","ok");toast(`已整理 ${patches.length.toLocaleString()} 行规则格式`)};
          const batch=()=>{const deadline=performance.now()+12;while(pos<=source.length&&performance.now()<deadline){const nl=source.indexOf("\n",pos),end=nl<0?source.length:nl,rawLine=source.slice(pos,end),line=rawLine.endsWith("\r")?rawLine.slice(0,-1):rawLine,replacement=norm(line);if(replacement!==rawLine)patches.push({start:pos,end,replacement});scanned++;if(nl<0){pos=source.length+1;break}pos=nl+1}if(pos<=source.length){status(`正在整理规则格式…已扫描 ${scanned.toLocaleString()} 行`);setTimeout(batch,0)}else done()};setTimeout(batch,0)
          }
          function dedupe(){
          if(s.formatBusy||s.dedupeBusy)return;
          const source=e.editor.value,dedupeRevision=s.revision,dedupeRepo=s.repo,dedupeBranch=s.branch,dedupePath=s.path,seen=new Set(),removals=[];let pos=0,scanned=0,removed=0;
          s.dedupeBusy=true;e.format.disabled=true;e.dedupe.disabled=true;status("正在检查重复规则…");
          const addRemoval=(start,end)=>{const last=removals[removals.length-1];if(last&&start<=last.end){last.start=Math.min(last.start,start);last.end=Math.max(last.end,end)}else removals.push({start,end})};
          const done=()=>{s.dedupeBusy=false;e.format.disabled=false;e.dedupe.disabled=false;if(s.repo!==dedupeRepo||s.branch!==dedupeBranch||s.path!==dedupePath||s.revision!==dedupeRevision){status("内容已变化，已丢弃过期去重结果","bad");return}if(!removed){refresh();status("去重检查已完成","ok");toast("没有完全重复的规则");return}const out=[];let at=0;for(const x of removals){out.push(source.slice(at,x.start));at=x.end}out.push(source.slice(at));e.editor.value=out.join("");markDirty();status("去重已完成","ok");toast(`已移除 ${removed.toLocaleString()} 条重复规则`)};
          const batch=()=>{const deadline=performance.now()+12;while(pos<=source.length&&performance.now()<deadline){const nl=source.indexOf("\n",pos),end=nl<0?source.length:nl,l=source.slice(pos,end);if(rule(l)){const k=norm(l);if(seen.has(k)){removed++;if(nl<0&&pos>0){const last=removals[removals.length-1];if(last&&last.end===pos){last.start=Math.max(0,last.start-1);last.end=end}else addRemoval(pos-1,end)}else addRemoval(pos,end+1)}else seen.add(k)}scanned++;if(nl<0){pos=source.length+1;break}pos=nl+1}if(pos<=source.length){status(`正在检查重复规则…已扫描 ${scanned.toLocaleString()} 行`);setTimeout(batch,0)}else done()};setTimeout(batch,0)
          }
          ''').strip()

          pattern = r'function format\(\)\{.*?\}function dedupe\(\)\{.*?\}(?=function updateHeader\(\))'
          matches = list(re.finditer(pattern, s, flags=re.S))
          if len(matches) != 1:
              raise SystemExit(f'format/dedupe matches={len(matches)}')
          s = re.sub(pattern, new_funcs, s, count=1, flags=re.S)

          p.write_text(s)
          script = s.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/large-editor.js').write_text(script)
          PY
          node --check /tmp/large-editor.js
          git diff --check
          grep -q 'formatBusy:false,dedupeBusy:false' large-editor.html
          grep -q '正在整理规则格式…已扫描' large-editor.html
          grep -q '正在检查重复规则…已扫描' large-editor.html
          ! grep -q 'split("\\n").map(norm)' large-editor.html
          ! grep -q 'split("\\n").filter' large-editor.html
          git diff -- large-editor.html
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- large-editor.html; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add large-editor.html
          git commit -m 'Chunk large editor format and dedupe'
          git push origin HEAD:main
