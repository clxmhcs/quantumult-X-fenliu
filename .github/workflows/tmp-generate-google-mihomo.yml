name: Temporary Generate Google Mihomo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-generate-google-mihomo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Mihomo rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter

          src = Path('Google/Google.list')
          dst = Path('Google/Google-Mihomo.list')

          raw = src.read_text(encoding='utf-8').splitlines()
          out = []
          counts = Counter()
          skipped = Counter()

          mapping = {
              'HOST': 'DOMAIN',
              'HOST-SUFFIX': 'DOMAIN-SUFFIX',
              'HOST-KEYWORD': 'DOMAIN-KEYWORD',
              'IP-CIDR': 'IP-CIDR',
              'IP6-CIDR': 'IP-CIDR6',
          }

          for line in raw:
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              parts = [p.strip() for p in line.split(',')]
              kind = parts[0]
              if kind == 'USER-AGENT':
                  skipped[kind] += 1
                  continue
              if kind not in mapping:
                  raise SystemExit(f'Unsupported source rule: {line}')
              if len(parts) < 2 or not parts[1]:
                  raise SystemExit(f'Malformed source rule: {line}')
              target = mapping[kind]
              value = parts[1]
              if target in ('IP-CIDR', 'IP-CIDR6'):
                  out.append(f'{target},{value},no-resolve')
              else:
                  out.append(f'{target},{value}')
              counts[target] += 1

          expected = {
              'DOMAIN': 14,
              'DOMAIN-KEYWORD': 5,
              'DOMAIN-SUFFIX': 684,
              'IP-CIDR': 4,
              'IP-CIDR6': 1,
          }
          if dict(counts) != expected:
              raise SystemExit(f'Count mismatch: got={dict(counts)} expected={expected}')
          if skipped['USER-AGENT'] != 3:
              raise SystemExit(f'USER-AGENT skip mismatch: {skipped["USER-AGENT"]}')
          if len(out) != 708:
              raise SystemExit(f'Total mismatch: {len(out)} != 708')

          header = [
              '# NAME: Google',
              '# AUTHOR: clxmhcs',
              '# REPO: https://github.com/clxmhcs/quantumult-X-fenliu',
              '# SOURCE: Google/Google.list',
              '# FORMAT: Mihomo classical rule-provider (text)',
              '# UPDATED: 2026-08-29',
              '# DOMAIN: 14',
              '# DOMAIN-KEYWORD: 5',
              '# DOMAIN-SUFFIX: 684',
              '# IP-CIDR: 4',
              '# IP-CIDR6: 1',
              '# OMITTED-USER-AGENT: 3',
              '# TOTAL: 708',
              '#',
              '# Mihomo rule-provider settings:',
              '# behavior: classical',
              '# format: text',
              '#',
              '# NOTE: Quantumult X USER-AGENT rules have no equivalent Mihomo routing rule',
              '# and are intentionally omitted rather than approximated.',
              '',
          ]
          dst.write_text('\n'.join(header + out) + '\n', encoding='utf-8')
          print('generated', dst, 'rules=', len(out), 'counts=', dict(counts), 'skipped=', dict(skipped))
          PY

      - name: Commit generated file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Google/Google-Mihomo.list
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: add Mihomo Google rules"
          git push
