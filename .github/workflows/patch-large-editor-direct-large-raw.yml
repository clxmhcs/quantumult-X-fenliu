name: Patch large editor direct large raw
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-large-editor-direct-large-raw.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch large-file read path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('large-editor.html')
          s=p.read_text()
          old='if(f?.cdn){meta=f;value=await rawText(path)}else{meta=await json(api(`contents/${safe(path)}?ref=${encodeURIComponent(s.branch)}`),{headers:auth()});value=meta.content?b64in(meta.content):await rawText(path)}'
          new='if(f?.cdn||Number(f?.size||0)>1024*1024){meta=f;value=await rawText(path)}else{meta=await json(api(`contents/${safe(path)}?ref=${encodeURIComponent(s.branch)}`),{headers:auth()});value=meta.content?b64in(meta.content):await rawText(path)}'
          if s.count(old)!=1: raise SystemExit(f'loadFile anchor={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/large-editor.js').write_text(script)
          PY
          node --check /tmp/large-editor.js
          git diff --check
          grep -q 'f?.cdn||Number(f?.size||0)>1024\*1024' large-editor.html
          test "$(grep -o 'contents/${safe(path)}?ref=' large-editor.html | wc -l)" -ge 1
          git diff -- large-editor.html
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- large-editor.html; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add large-editor.html
          git commit -m 'Read large list files directly from raw content'
          git push origin HEAD:main
