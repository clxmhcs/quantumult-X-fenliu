name: Restyle IMG_5626

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restyle-img-5626.yml'

permissions:
  contents: write

jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restyle IMG_5626 to ChatGPT-like semi-transparent look
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageFilter, ImageStat
          from io import BytesIO
          import math, os

          ref_path = 'proxy-icons/IMG_5461.png'
          src_path = 'proxy-icons/IMG_5626.jpeg'
          out_path = src_path

          ref = Image.open(ref_path).convert('RGB')
          src = Image.open(src_path).convert('RGB')

          # Match the reference canvas size.
          W, H = ref.size
          if (W, H) != (108, 108):
              W = H = 108

          # Sample ChatGPT icon border color as the visual background reference.
          rp = ref.load()
          border = []
          b = 6
          for y in range(ref.height):
              for x in range(ref.width):
                  if x < b or x >= ref.width-b or y < b or y >= ref.height-b:
                      border.append(rp[x, y])
          bg = tuple(round(sum(p[i] for p in border)/len(border)) for i in range(3))

          # Estimate current IMG_5626 background from its border.
          sp = src.load()
          sborder = []
          b2 = max(2, min(src.size)//18)
          for y in range(src.height):
              for x in range(src.width):
                  if x < b2 or x >= src.width-b2 or y < b2 or y >= src.height-b2:
                      sborder.append(sp[x, y])
          sbg = tuple(round(sum(p[i] for p in sborder)/len(sborder)) for i in range(3))

          # Build a soft mask that keeps the colorful Gemini mark while discarding the baked checker/light background.
          mask = Image.new('L', src.size, 0)
          mp = mask.load()
          for y in range(src.height):
              for x in range(src.width):
                  r,g,bv = sp[x,y]
                  mx = max(r,g,bv); mn = min(r,g,bv)
                  sat = 0.0 if mx == 0 else (mx-mn)/mx
                  dist = math.sqrt((r-sbg[0])**2 + (g-sbg[1])**2 + (bv-sbg[2])**2)
                  a_dist = max(0.0, min(1.0, (dist-14.0)/42.0))
                  a_sat  = max(0.0, min(1.0, (sat-0.08)/0.28))
                  a = max(a_dist, a_sat)
                  mp[x,y] = round(255*a)
          mask = mask.filter(ImageFilter.GaussianBlur(0.65))

          # Tight bbox from the actual logo; keep exactly ~4px breathing room on a 108px canvas.
          bbox = mask.point(lambda v: 255 if v >= 40 else 0).getbbox()
          if not bbox:
              raise RuntimeError('Could not detect IMG_5626 foreground mark')
          crop = src.crop(bbox)
          cmask = mask.crop(bbox)

          max_side = 100  # 4px nominal margin on each side when centered.
          scale = min(max_side/crop.width, max_side/crop.height)
          nw = max(1, round(crop.width*scale)); nh = max(1, round(crop.height*scale))
          crop = crop.resize((nw,nh), Image.Resampling.LANCZOS)
          cmask = cmask.resize((nw,nh), Image.Resampling.LANCZOS)

          # Semi-transparent visual treatment: preserve Gemini colors but fade them into the same neutral background family as the ChatGPT icon.
          opacity = 0.58
          cmask = cmask.point(lambda v: round(v*opacity))
          fg = crop.convert('RGBA')
          fg.putalpha(cmask)
          canvas = Image.new('RGBA', (W,H), bg + (255,))
          x = (W-nw)//2; y = (H-nh)//2
          canvas.alpha_composite(fg, (x,y))
          final = canvas.convert('RGB')

          # Search JPEG settings for about 15 KiB while never exceeding 20 KiB.
          target = 15*1024
          limit = 20*1024
          candidates = []
          for q in range(72, 101):
              for subsampling in (0, 1, 2):
                  buf = BytesIO()
                  final.save(buf, format='JPEG', quality=q, subsampling=subsampling, optimize=False, progressive=False)
                  data = buf.getvalue()
                  if len(data) <= limit:
                      candidates.append((abs(len(data)-target), -q, subsampling, data))
          if not candidates:
              raise RuntimeError('Could not encode IMG_5626 under 20 KiB')
          candidates.sort(key=lambda t: (t[0], t[1], t[2]))
          _, nq, ss, data = candidates[0]
          q = -nq
          with open(out_path, 'wb') as f:
              f.write(data)

          # Final verification.
          chk = Image.open(out_path)
          size = os.path.getsize(out_path)
          if chk.size != (108,108):
              raise RuntimeError(f'Unexpected dimensions: {chk.size}')
          if size > limit:
              raise RuntimeError(f'Unexpected size: {size}')
          print(f'RESULT format=JPEG dimensions={chk.size[0]}x{chk.size[1]} size={size}B ({size/1024:.2f}KiB) quality={q} subsampling={ss} opacity={opacity} bg={bg} bbox={bbox} placed={nw}x{nh} at {x},{y}')
          PY

          rm -f .github/workflows/restyle-img-5626.yml

      - name: Commit result and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'proxy-icons: restyle IMG_5626 semi-transparent near 15KB'
          git push origin HEAD:main
