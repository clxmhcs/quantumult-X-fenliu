name: Patch large editor FINAL add rule
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-large-editor-final-add.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch FINAL-aware add rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('large-editor.html')
          s=p.read_text()
          old='function add(){if(!s.path){toast("请先加载一个文件");return}const t=(prompt("规则类型：","HOST")||"").trim().toUpperCase(),v=(prompt("匹配内容：","apps.apple.com")||"").trim(),p=(prompt("策略组 / 动作：","Apple")||"").trim();if(!t||!v||!p)return;e.editor.value=e.editor.value.replace(/\\s*$/,"")+(e.editor.value.trim()?"\\n":"")+`${t},${v},${p}\\n`;markDirty()}'
          new='function composeRule(t,v,p){return t==="FINAL"?`${t},${p}`:`${t},${v},${p}`}function add(){if(!s.path){toast("请先加载一个文件");return}const t=(prompt("规则类型：","HOST")||"").trim().toUpperCase();if(!t)return;let v="",p="";if(t==="FINAL"){p=(prompt("策略组 / 动作：","Direct")||"").trim();if(!p)return}else{v=(prompt("匹配内容：","apps.apple.com")||"").trim();p=(prompt("策略组 / 动作：","Apple")||"").trim();if(!v||!p)return}const line=composeRule(t,v,p);e.editor.value=e.editor.value.replace(/\\s*$/,"")+(e.editor.value.trim()?"\\n":"")+`${line}\\n`;markDirty()}'
          if s.count(old)!=1: raise SystemExit(f'add anchor={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/large-editor.js').write_text(script)
          PY
          node --check /tmp/large-editor.js
          git diff --check
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const html=fs.readFileSync('large-editor.html','utf8');
          const script=html.split('<script>',2)[1].split('</script>',1)[0];
          const start=script.indexOf('function composeRule');
          const end=script.indexOf('function download()',start);
          if(start<0||end<0)throw new Error('composeRule slice missing');
          const src=script.slice(start,end).replace(/function add\(\)\{[\s\S]*$/,'')+';globalThis.__composeRule=composeRule;';
          const sandbox={};vm.createContext(sandbox);vm.runInContext(src,sandbox);
          const f=sandbox.__composeRule;
          if(f('FINAL','ignored','Direct')!=='FINAL,Direct')throw new Error('FINAL two-field compose failed');
          if(f('HOST-SUFFIX','example.com','Proxy')!=='HOST-SUFFIX,example.com,Proxy')throw new Error('normal three-field compose failed');
          NODE
          grep -q 'function composeRule' large-editor.html
          grep -q 'if(t==="FINAL")' large-editor.html
          grep -q '`${t},${p}`' large-editor.html
          ! grep -q '`${t},${v},${p}\\n`;markDirty()' large-editor.html
          git diff -- large-editor.html
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- large-editor.html; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add large-editor.html
          git commit -m 'Add FINAL rules with correct shape'
          git push origin HEAD:main
