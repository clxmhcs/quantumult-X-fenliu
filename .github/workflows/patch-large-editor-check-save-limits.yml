# retrigger-v5
name: Patch large editor check and save limits
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-large-editor-check-save-limits.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch validation cap and current save size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('large-editor.html')
          s=p.read_text()

          pattern=r'function check\(\)\{.*?\}(?=function find\(\))'
          matches=list(re.finditer(pattern,s,re.S))
          if len(matches)!=1: raise SystemExit(f'check function matches={len(matches)}')
          new_check=r'''function check(){if(s.checkBusy)return;const source=e.editor.value,checkRevision=s.revision,checkRepo=s.repo,checkBranch=s.branch,checkPath=s.path,list=[];let issueCount=0,pos=0,lineNo=1,scanned=0;const addIssue=(kind,line,message)=>{issueCount++;if(list.length<500)list.push([kind,line,message])};s.checkBusy=true;e.check.disabled=true;status("正在校验…");const done=()=>{s.checkBusy=false;e.check.disabled=false;if(s.repo!==checkRepo||s.branch!==checkBranch||s.path!==checkPath||s.revision!==checkRevision){status("内容已变化，已丢弃过期校验结果","bad");return}if(!issueCount){e.issues.innerHTML='<div class="issue" style="background:color-mix(in srgb,var(--green) 15%,transparent);cursor:default">校验通过：未发现基础格式问题。</div>';e.issues.className="issues show";status("校验通过","ok");return}e.issues.innerHTML=list.map(x=>`<div class="issue ${x[0]==="warn"?"warn":""}" data-line="${x[1]}">第 ${x[1]} 行：${x[2]}</div>`).join("")+(issueCount>list.length?`<div class="issue">仅显示前 ${list.length} 项，共 ${issueCount} 项。</div>`:"");e.issues.className="issues show";e.issues.querySelectorAll("[data-line]").forEach(x=>x.onclick=()=>gotoLine(+x.dataset.line));status(`发现 ${issueCount} 个待检查项`,"bad")};const batch=()=>{const deadline=performance.now()+12;while(pos<=source.length&&performance.now()<deadline){const nl=source.indexOf("\n",pos),end=nl<0?source.length:nl,l=source.slice(pos,end);if(rule(l)){const p=parts(l),t=(p[0]||"").toUpperCase();if(!known.has(t))addIssue("warn",lineNo,`未识别类型 ${t||"(空)"}`);if(p.length<2||!p[1])addIssue("bad",lineNo,"缺少匹配内容或策略");if(t!=="FINAL"&&p.length<3)addIssue("bad",lineNo,"缺少策略组 / 动作")}scanned++;if(nl<0){pos=source.length+1;break}pos=nl+1;lineNo++}if(pos<=source.length){status(`正在校验…已扫描 ${scanned.toLocaleString()} 行`);setTimeout(batch,0)}else done()};setTimeout(batch,0)}'''
          s=re.sub(pattern,lambda m:new_check,s,count=1,flags=re.S)

          guard='if(s.size>90*1024*1024){toast("文件过大，建议使用 GitHub Desktop 或 git 提交");return}'
          if s.count(guard)!=1: raise SystemExit(f'save guard count={s.count(guard)}')
          s=s.replace(guard,'',1)
          prefix='const bodySnapshot=text(e.editor.value),snapshotRevision='
          replacement='const bodySnapshot=text(e.editor.value),bodySize=new Blob([bodySnapshot]).size;if(bodySize>60*1024*1024){toast("当前编辑内容超过 60 MB，建议使用 GitHub Desktop 或 git 提交");return}\nconst snapshotRevision='
          if s.count(prefix)!=1: raise SystemExit(f'body snapshot prefix count={s.count(prefix)}')
          s=s.replace(prefix,replacement,1)
          old_size='s.size=new Blob([bodySnapshot]).size'
          if s.count(old_size)!=1: raise SystemExit(f'post-save size count={s.count(old_size)}')
          s=s.replace(old_size,'s.size=bodySize',1)

          p.write_text(s)
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/large-editor.js').write_text(script)
          PY
          node --check /tmp/large-editor.js
          git diff --check
          grep -q 'let issueCount=0' large-editor.html
          grep -q 'list.length<500' large-editor.html
          grep -q 'issueCount>list.length' large-editor.html
          grep -q 'bodySize>60\*1024\*1024' large-editor.html
          ! grep -q 's.size>90\*1024\*1024' large-editor.html
          ! grep -q 's.size=new Blob' large-editor.html
          git diff -- large-editor.html
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- large-editor.html; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add large-editor.html
          git commit -m 'Bound validation memory and check current save size'
          git push origin HEAD:main
