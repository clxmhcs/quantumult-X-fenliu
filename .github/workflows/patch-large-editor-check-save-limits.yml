# retrigger-v4
name: Patch large editor check and save limits
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-large-editor-check-save-limits.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch validation cap and current save size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('large-editor.html')
          s=p.read_text()

          m=re.search(r'function check\(\)\{.*?\}(?=function find\(\))',s,re.S)
          if not m: raise SystemExit('check function not found')
          check=m.group(0)
          try:
              a=check.index('list=[];')
              b=check.index('s.checkBusy=true;',a)+len('s.checkBusy=true;')
          except ValueError:
              at=check.find('checkPath=s.path')
              raise SystemExit('check markers not found: '+repr(check[max(0,at):at+220]))
          new_state='list=[];let issueCount=0,pos=0,lineNo=1,scanned=0;const addIssue=(kind,line,message)=>{issueCount++;if(list.length<500)list.push([kind,line,message])};s.checkBusy=true;'
          check=check[:a]+new_state+check[b:]
          reps=[
            ('if(!list.length)','if(!issueCount)'),
            ('list.slice(0,500).map','list.map'),
            ('list.length>500?`<div class="issue">仅显示前 500 项，共 ${list.length} 项。</div>`','issueCount>list.length?`<div class="issue">仅显示前 ${list.length} 项，共 ${issueCount} 项。</div>`'),
            ('status(`发现 ${list.length} 个待检查项`,"bad")','status(`发现 ${issueCount} 个待检查项`,"bad")'),
            ('list.push(["warn",lineNo,`未识别类型 ${t||"(空)"}`])','addIssue("warn",lineNo,`未识别类型 ${t||"(空)"}`)'),
            ('list.push(["bad",lineNo,"缺少匹配内容或策略"])','addIssue("bad",lineNo,"缺少匹配内容或策略")'),
            ('list.push(["bad",lineNo,"缺少策略组 / 动作"])','addIssue("bad",lineNo,"缺少策略组 / 动作")'),
          ]
          for old,new in reps:
              if check.count(old)!=1: raise SystemExit(f'check anchor {old[:36]!r} count={check.count(old)}')
              check=check.replace(old,new,1)
          s=s[:m.start()]+check+s[m.end():]

          guard='if(s.size>90*1024*1024){toast("文件过大，建议使用 GitHub Desktop 或 git 提交");return}'
          if s.count(guard)!=1: raise SystemExit(f'save guard count={s.count(guard)}')
          s=s.replace(guard,'',1)
          prefix='const bodySnapshot=text(e.editor.value),snapshotRevision='
          replacement='const bodySnapshot=text(e.editor.value),bodySize=new Blob([bodySnapshot]).size;if(bodySize>60*1024*1024){toast("当前编辑内容超过 60 MB，建议使用 GitHub Desktop 或 git 提交");return}\nconst snapshotRevision='
          if s.count(prefix)!=1: raise SystemExit(f'body snapshot prefix count={s.count(prefix)}')
          s=s.replace(prefix,replacement,1)
          old_size='s.size=new Blob([bodySnapshot]).size'
          if s.count(old_size)!=1: raise SystemExit(f'post-save size count={s.count(old_size)}')
          s=s.replace(old_size,'s.size=bodySize',1)

          p.write_text(s)
          script=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/large-editor.js').write_text(script)
          PY
          node --check /tmp/large-editor.js
          git diff --check
          grep -q 'let issueCount=0' large-editor.html
          grep -q 'list.length<500' large-editor.html
          grep -q 'issueCount>list.length' large-editor.html
          grep -q 'bodySize>60\*1024\*1024' large-editor.html
          ! grep -q 's.size>90\*1024\*1024' large-editor.html
          ! grep -q 's.size=new Blob' large-editor.html
          git diff -- large-editor.html
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- large-editor.html; then
            echo 'No changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add large-editor.html
          git commit -m 'Bound validation memory and check current save size'
          git push origin HEAD:main
