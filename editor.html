<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantumult X List 编辑器</title>
<style>
body{margin:0;background:#f5f7fa;color:#17212f;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:1200px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:12px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:260px 1fr;gap:12px}.files{max-height:420px;overflow:auto;display:grid;gap:5px}.file,.btn{border:1px solid #dfe4ea;border-radius:8px;background:#fff;color:#17212f;padding:8px 10px}.file{text-align:left;overflow-wrap:anywhere}.file.active{border-color:#0969da;background:#eaf3ff}.btn.primary{background:#0969da;color:#fff;border-color:#0969da}.btn.save{background:#1f883d;color:#fff;border-color:#1f883d}.btn:disabled{opacity:.55;cursor:not-allowed}input,select{border:1px solid #dfe4ea;border-radius:8px;padding:8px 10px;background:#fff;color:#17212f;font:inherit}textarea{width:100%;min-height:560px;resize:vertical;border:1px solid #dfe4ea;border-radius:10px;padding:10px;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}.repo-select{min-width:250px;max-width:100%}.muted{color:#667085}.auth-note{margin:8px 0}.auth-token{flex:1;min-width:260px}.auth-ok{color:#0d7a37}.auth-bad{color:#b42318}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.stat{border:1px solid #dfe4ea;border-radius:8px;padding:8px}.stat b{font-size:18px;display:block}.issues{display:none;max-height:160px;overflow:auto}.issues.show{display:block}.issue{background:#fff0ef;margin:4px 0;padding:6px 8px;border-radius:7px;font:12px ui-monospace,monospace}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;background:#17212f;color:#fff;border-radius:999px;padding:10px 14px;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.grid{grid-template-columns:1fr}textarea{min-height:430px}.auth-token{min-width:100%}.repo-select{width:100%}}
</style>
</head>
<body>
<main class="app">
<h1>Quantumult X List 编辑器</h1>
<p class="muted">读取、修改、校验并直接保存任意 GitHub 仓库中的 .list 分流规则。</p>
<div class="card"><div class="row"><label>选择仓库 <select id="repoSelect" class="repo-select"><option value="">正在加载仓库…</option></select></label><button id="refreshRepos" class="btn">刷新仓库</button><span id="repoStatus" class="muted">选择后自动读取；授权后可显示私有仓库</span></div><div class="row" style="margin-top:10px"><label>手动仓库 <input id="repo" value="clxmhcs/quantumult-X-fenliu" placeholder="用户名/仓库名或 GitHub URL" spellcheck="false"></label><label>分支 <input id="branch" value="" placeholder="留空自动识别" spellcheck="false"></label><button id="read" class="btn primary">读取规则文件</button><span id="status" class="muted"></span></div></div>
<div class="card">
<div class="row"><b>GitHub 授权</b><span id="authStatus" class="muted">未授权</span></div>
<p class="muted auth-note">用于“保存到 GitHub”。令牌只保存在当前网页的 JavaScript 内存中，不写入 localStorage、sessionStorage、Cookie、URL 或仓库；刷新或关闭页面后需要重新授权。</p>
<div class="row"><input id="token" class="auth-token" type="password" placeholder="Fine-grained PAT（github_pat_…）" autocomplete="off" autocapitalize="none" spellcheck="false"><button id="auth" class="btn primary">验证授权</button><button id="logout" class="btn" disabled>清除授权</button></div>
<div id="authDetail" class="muted" style="margin-top:8px">令牌应授权目标仓库，并设置 Contents：Read and write。</div>
</div>
<section class="grid"><aside class="card"><h3>规则文件</h3><div id="files" class="files"><span class="muted">点击读取规则文件</span></div><div id="stats" class="stats"></div></aside><section class="card"><div class="row"><b id="path">尚未选择文件</b><span id="dirty" class="muted">未加载</span></div><div class="row" style="margin:10px 0"><input id="search" placeholder="查找域名、策略或规则" style="flex:1"><button id="find" class="btn">下一个</button><button id="add" class="btn">新增规则</button><button id="format" class="btn">整理格式</button><button id="dedupe" class="btn">规则去重</button><button id="header" class="btn">更新统计</button><button id="check" class="btn">校验</button><button id="copy" class="btn">复制全文</button><button id="clear" class="btn">清空</button><button id="replaceMeta" class="btn">一键替换</button><button id="download" class="btn">下载</button><button id="open" class="btn">GitHub查看</button><button id="save" class="btn save" disabled>保存到 GitHub</button></div><textarea id="editor" disabled spellcheck="false" wrap="off"></textarea><div id="issues" class="issues"></div></section></section>
</main><div id="toast" class="toast"></div>
<script>
(()=>{
const PUBLIC_REPOS=['clxmhcs/quantumult-X','clxmhcs/boxjs','clxmhcs/Shadowrocket','clxmhcs/quantumult-X-fenliu','clxmhcs/dianshivideo','clxmhcs/zhongyaocai-android','clxmhcs/chinaunicom-android','clxmhcs/weather-ios'].map(full_name=>({full_name,default_branch:'main',private:false}));
const $=id=>document.getElementById(id),e={repoSelect:$('repoSelect'),refreshRepos:$('refreshRepos'),repoStatus:$('repoStatus'),repo:$('repo'),branch:$('branch'),read:$('read'),status:$('status'),authStatus:$('authStatus'),authDetail:$('authDetail'),token:$('token'),auth:$('auth'),logout:$('logout'),files:$('files'),stats:$('stats'),path:$('path'),dirty:$('dirty'),search:$('search'),find:$('find'),add:$('add'),format:$('format'),dedupe:$('dedupe'),header:$('header'),check:$('check'),copy:$('copy'),clear:$('clear'),replaceMeta:$('replaceMeta'),download:$('download'),open:$('open'),save:$('save'),editor:$('editor'),issues:$('issues'),toast:$('toast')},s={files:[],repos:PUBLIC_REPOS.map(x=>({...x})),path:'',original:'',loadedSha:'',loadedMode:'100644',loadedRepo:'',loadedBranch:'',lastSavedSha:'',find:0,timer:0,refreshTimer:0,token:'',login:'',authRepo:'',authBusy:false,repoBusy:false,saveBusy:false};
const known=new Set(['HOST','HOST-SUFFIX','HOST-KEYWORD','HOST-WILDCARD','IP-ASN','IP-CIDR','IP6-CIDR','GEOIP','USER-AGENT','URL-REGEX','PROCESS-NAME','PROCESS-PATH','FINAL','AND','OR','NOT']),heads=new Set(['HOST','HOST-SUFFIX','HOST-KEYWORD','HOST-WILDCARD','IP-ASN','IP-CIDR','IP6-CIDR','GEOIP','USER-AGENT','TOTAL']),shown=['TOTAL','HOST','HOST-SUFFIX','HOST-KEYWORD','HOST-WILDCARD','IP-ASN','IP-CIDR','IP6-CIDR','GEOIP','USER-AGENT'];
const text=v=>String(v||'').replace(/\r\n/g,'\n'),repo=()=>e.repo.value.trim().replace(/^https?:\/\/(?:www\.)?github\.com\//i,'').replace(/\.git\/?$/i,'').replace(/^\/+|\/+$/g,'').split('/').slice(0,2).join('/'),branch=()=>e.branch.value.trim(),apiFor=(r,p)=>`https://api.github.com/repos/${r}/${p}`,api=p=>apiFor(s.loadedRepo||repo(),p),safe=p=>p.split('/').map(encodeURIComponent).join('/'),rule=l=>l.trim()&&!l.trimStart().startsWith('#'),parts=l=>l.split(',').map(x=>x.trim()),mb=n=>(Number(n||0)/1048576).toFixed(2)+' MB',bytes=v=>new TextEncoder().encode(v).length;
function toast(v){clearTimeout(s.timer);e.toast.textContent=v;e.toast.className='toast show';s.timer=setTimeout(()=>e.toast.className='toast',3000)}
function status(v,k){e.status.textContent=v;e.status.style.color=k||'#667085'}
function setAuth(ok,title,detail){e.authStatus.textContent=title;e.authStatus.className=ok?'auth-ok':'auth-bad';e.authDetail.textContent=detail;e.logout.disabled=!ok;updateSaveButton()}
function stateLabel(){if(!s.path)return'未加载';if(e.editor.value!==s.original)return'有未保存修改';return s.lastSavedSha?'已保存到 GitHub':'已加载'}
function updateSaveButton(){e.save.disabled=!s.token||!s.path||!s.loadedSha||e.editor.value===s.original||s.saveBusy||s.authRepo!==s.loadedRepo||repo()!==s.loadedRepo||branch()!==s.loadedBranch}
function decode(v){const x=atob(v.replace(/\n/g,''));return new TextDecoder().decode(Uint8Array.from(x,c=>c.charCodeAt(0)))}
function ghHeaders(token=s.token,accept='application/vnd.github+json',json=false){const h={Accept:accept,'X-GitHub-Api-Version':'2022-11-28'};if(token)h.Authorization=`Bearer ${token}`;if(json)h['Content-Type']='application/json';return h}
async function jsonFetch(u,token=s.token,accept='application/vnd.github+json'){const r=await fetch(u,{headers:ghHeaders(token,accept),cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok){const err=new Error(d.message||`请求失败 ${r.status}`);err.status=r.status;throw err}return d}
async function jsonWrite(u,method,body){const r=await fetch(u,{method,headers:ghHeaders(s.token,'application/vnd.github+json',true),cache:'no-store',body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok){const err=new Error(d.message||`请求失败 ${r.status}`);err.status=r.status;err.data=d;throw err}return d}
async function textFetch(u,token=s.token,accept='text/plain'){const r=await fetch(u,{headers:ghHeaders(token,accept),cache:'no-store'}),body=await r.text();if(!r.ok){let msg='';try{msg=JSON.parse(body).message||''}catch{}const err=new Error(msg||`请求失败 ${r.status}`);err.status=r.status;throw err}return body}
async function req(u){return await jsonFetch(u)}
function renderRepositories(){const current=repo(),all=[...s.repos];if(current&&!all.some(x=>x.full_name.toLowerCase()===current.toLowerCase()))all.unshift({full_name:current,default_branch:branch(),private:false});e.repoSelect.innerHTML='';const first=document.createElement('option');first.value='';first.textContent=all.length?'请选择仓库':'没有可选择的仓库';e.repoSelect.appendChild(first);for(const item of all){const option=document.createElement('option');option.value=item.full_name;option.textContent=`${item.full_name}${item.private?'（私有）':''}`;option.dataset.branch=item.default_branch||'';e.repoSelect.appendChild(option)}if(all.some(x=>x.full_name===current))e.repoSelect.value=current}
async function loadRepositories(){if(s.repoBusy)return;s.repoBusy=true;e.refreshRepos.disabled=true;e.repoStatus.textContent='正在加载仓库…';const owner=(repo().split('/')[0]||'clxmhcs');try{const url=s.token?'https://api.github.com/user/repos?per_page=100&sort=updated&affiliation=owner,collaborator,organization_member':`https://api.github.com/users/${encodeURIComponent(owner)}/repos?per_page=100&sort=updated&type=owner`,items=await jsonFetch(url);if(!Array.isArray(items))throw new Error('GitHub 未返回仓库列表');s.repos=items.map(x=>({full_name:String(x.full_name||''),default_branch:String(x.default_branch||''),private:!!x.private})).filter(x=>x.full_name).sort((a,b)=>a.full_name.localeCompare(b.full_name,'zh-CN'));renderRepositories();e.repoStatus.textContent=`已加载 ${s.repos.length} 个${s.token?'可访问':'公开'}仓库；选择后自动读取`}catch(x){renderRepositories();e.repoStatus.textContent=`GitHub API 已限流，正在使用内置公开仓库列表（${s.repos.length} 个）`}finally{s.repoBusy=false;e.refreshRepos.disabled=false}}
async function jsDelivrTree(target,candidate){const [owner,name]=target.split('/'),url=`https://data.jsdelivr.com/v1/packages/gh/${encodeURIComponent(owner)}/${encodeURIComponent(name)}@${encodeURIComponent(candidate)}?structure=flat`,data=await jsonFetch(url,'');if(!Array.isArray(data.files))throw new Error('公共文件索引不可用');return {tree:data.files.map(x=>({type:'blob',path:String(x.name||'').replace(/^\//,''),size:Number(x.size||0),sha:'',mode:'100644',cdn:true}))}}
async function readTree(target,requested){const candidates=[];if(requested)candidates.push(requested);const selected=s.repos.find(x=>x.full_name.toLowerCase()===target.toLowerCase());if(selected?.default_branch)candidates.push(selected.default_branch);let infoError=null;if(!requested&&!selected?.default_branch){try{const info=await jsonFetch(apiFor(target,''));if(info.default_branch)candidates.push(String(info.default_branch))}catch(x){infoError=x}}candidates.push('main','master');const unique=[...new Set(candidates.filter(Boolean))];let lastError=infoError;for(const candidate of unique){try{return {branch:candidate,data:await jsonFetch(apiFor(target,`git/trees/${encodeURIComponent(candidate)}?recursive=1`)),source:'github'}}catch(x){lastError=x}}if(!s.token&&(selected?.private===false||!selected)){for(const candidate of unique){try{return {branch:candidate,data:await jsDelivrTree(target,candidate),source:'jsdelivr'}}catch(x){lastError=x}}}const detail=lastError?.message&&lastError.message!=='Load failed'?`：${lastError.message}`:'';throw new Error(`无法读取 ${target} 或识别默认分支${detail}。私有仓库请先授权；公开仓库请稍后重试`)}
async function raw(p){if(s.token)return await textFetch(api(`contents/${safe(p)}?ref=${encodeURIComponent(s.loadedBranch)}`),s.token,'application/vnd.github.raw+json');const u=`https://raw.githubusercontent.com/${s.loadedRepo}/${safe(s.loadedBranch)}/${safe(p)}`,r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`读取原始文件失败 ${r.status}`);return await r.text()}
async function verifyAuth(){if(s.authBusy)return;const token=e.token.value.trim(),target=repo();if(!/^[^/\s]+\/[^/\s]+$/.test(target)){setAuth(false,'未授权','仓库格式应为 用户名/仓库名 或完整 GitHub URL。');e.repo.focus();return}if(!token){setAuth(false,'未授权','请输入 Fine-grained personal access token。');e.token.focus();return}s.authBusy=true;e.auth.disabled=true;e.logout.disabled=true;setAuth(false,'正在验证…',`正在验证 GitHub 身份和 ${target} 的读取权限。`);try{const user=await jsonFetch('https://api.github.com/user',token),login=String(user.login||'');if(!login)throw new Error('无法确认 GitHub 登录身份');const info=await jsonFetch(apiFor(target,''),token);if(!info||!info.full_name)throw new Error('令牌无法读取目标仓库');s.token=token;s.login=login;s.authRepo=target;e.repo.value=target;e.token.value='';setAuth(true,`已授权 ${login}`,`已验证 ${target} 的读取权限；保存时会实际验证 Contents 写权限。令牌仅保存在当前页面内存。`);toast('GitHub 授权成功')}catch(x){s.token='';s.login='';s.authRepo='';setAuth(false,'授权失败',x.message||'GitHub 授权失败');toast('GitHub 授权失败')}finally{s.authBusy=false;e.auth.disabled=false;e.logout.disabled=!s.token;updateSaveButton()}}
function clearAuth(){s.token='';s.login='';s.authRepo='';e.token.value='';setAuth(false,'未授权',`目标仓库：${repo()||'未填写'}。令牌应授权此仓库，并设置 Contents：Read and write。`);toast('已清除 GitHub 授权')}
function count(v){const c={TOTAL:0};for(const l of text(v).split('\n')){if(!rule(l))continue;const t=(parts(l)[0]||'').toUpperCase();c[t]=(c[t]||0)+1;c.TOTAL++}return c}
function refreshStats(){const c=count(e.editor.value);e.stats.innerHTML=shown.filter(k=>c[k]||k==='TOTAL').map(k=>`<div class="stat"><b>${c[k]||0}</b><span>${k}</span></div>`).join('');return c}
function refresh(){refreshStats();e.dirty.textContent=stateLabel();updateSaveButton()}
function scheduleRefresh(){e.dirty.textContent=stateLabel();updateSaveButton();clearTimeout(s.refreshTimer);s.refreshTimer=setTimeout(refreshStats,250)}
function norm(l){return rule(l)?parts(l).join(','):l.replace(/[ \t]+$/g,'')}
function render(){if(!s.files.length){e.files.innerHTML='<span class="muted">未找到 .list 文件</span>';return}e.files.innerHTML='';for(const f of s.files){const b=document.createElement('button');b.className='file'+(f.path===s.path?' active':'');b.textContent=f.path;b.onclick=()=>load(f.path);e.files.appendChild(b)}}
async function read(){const target=repo();if(!/^[^/\s]+\/[^/\s]+$/.test(target)){status('仓库格式应为 用户名/仓库名 或完整 GitHub URL','#b42318');return}if(s.path&&e.editor.value!==s.original&&!confirm('当前文件有未保存修改。仍然读取其它仓库吗？'))return;status(`正在读取 ${target} 并识别默认分支...`);try{const result=await readTree(target,branch()),targetBranch=result.branch,d=result.data;s.loadedRepo=target;s.loadedBranch=targetBranch;e.repo.value=target;e.branch.value=targetBranch;s.path='';s.original='';s.loadedSha='';s.lastSavedSha='';e.editor.value='';e.editor.disabled=true;e.path.textContent='尚未选择文件';e.dirty.textContent='未加载';s.files=(d.tree||[]).filter(x=>x.type==='blob'&&/\.list$/i.test(x.path)).sort((a,b)=>a.path.localeCompare(b.path,'zh-CN'));render();status(`在 ${target}@${targetBranch} 找到 ${s.files.length} 个 .list 文件${result.source==='jsdelivr'?' · 公共索引回退':''}${s.token&&s.authRepo===target?` · 已授权 ${s.login}`:''}`,'#0d7a37');if(s.files.length){const f=s.files.find(x=>/(^|\/)Apple\.list$/i.test(x.path))||s.files[0];await load(f.path)}}catch(x){status(x.message,'#b42318')}}
async function load(p){if(s.path&&e.editor.value!==s.original&&!confirm('当前文件有未保存修改。仍然切换吗？'))return;const f=s.files.find(x=>x.path===p),size=Number(f?.size||0),large=size>=1000000;status(`正在读取 ${p}${size?` · ${mb(size)}`:''}${large?' · 大文件模式':''}`);try{let body='';if(f?.cdn||large){body=await raw(p)}else{const d=await req(api(`contents/${safe(p)}?ref=${encodeURIComponent(s.loadedBranch)}`));if(d.content&&String(d.encoding||'base64').toLowerCase()==='base64')body=decode(d.content);else body=await raw(p)}if(size>0&&!body.length)throw new Error('读取失败：GitHub 未返回文件正文');s.path=p;s.original=text(body);s.loadedSha=String(f?.sha||'');s.loadedMode=String(f?.mode||'100644');s.lastSavedSha='';e.editor.value=s.original;e.editor.disabled=false;e.path.textContent=p;e.issues.className='issues';render();const c=refreshStats();e.dirty.textContent='已加载';updateSaveButton();status(`文件已加载 · ${s.loadedRepo}@${s.loadedBranch} · ${c.TOTAL} 条规则${size?` · ${mb(size)}`:''}${large?' · 大文件模式':''}${f?.cdn?' · 公共只读模式；保存前请授权并重新读取':''}${s.token&&s.authRepo===s.loadedRepo?` · 已授权 ${s.login}`:''}`,'#0d7a37')}catch(x){status(x.message,'#b42318')}}
function dt(){const d=new Date(),p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
function format(){const end=/\n$/.test(e.editor.value);let v=text(e.editor.value).split('\n').map(norm).join('\n');if(!end)v=v.replace(/\n$/,'');e.editor.value=v;refresh();toast('已整理格式')}
function dedupe(){const seen=new Set();let n=0;e.editor.value=text(e.editor.value).split('\n').filter(l=>{if(!rule(l))return true;const k=norm(l);if(seen.has(k)){n++;return false}seen.add(k);return true}).join('\n');refresh();toast(n?`已移除 ${n} 条重复规则`:'没有完全重复规则')}
function head(){const c=count(e.editor.value);let hit=false;e.editor.value=text(e.editor.value).split('\n').map(l=>{let m=l.match(/^(#\s*UPDATED\s*:\s*).*/i);if(m){hit=true;return m[1]+dt()}m=l.match(/^#\s*([A-Z0-9-]+)\s*:\s*\d+\s*$/i);if(m&&heads.has(m[1].toUpperCase())){hit=true;const n=m[1].toUpperCase();return `# ${n}: ${c[n]||0}`}return l}).join('\n');refresh();toast(hit?'已更新统计':'没有可更新的统计头部')}
function go(n){const a=e.editor.value.split('\n'),st=a.slice(0,Math.max(0,n-1)).join('\n').length+(n>1?1:0);e.editor.focus();e.editor.setSelectionRange(st,st+(a[n-1]||'').length)}
function check(){const list=[];text(e.editor.value).split('\n').forEach((l,i)=>{if(!rule(l))return;const p=parts(l),t=(p[0]||'').toUpperCase();if(!known.has(t))list.push([i+1,`未识别类型 ${t||'(空)'}`]);if(p.length<2||!p[1])list.push([i+1,'缺少匹配内容或策略']);if(t!=='FINAL'&&p.length<3)list.push([i+1,'缺少策略组 / 动作'])});if(!list.length){e.issues.innerHTML='<div class="issue">校验通过</div>';e.issues.className='issues show';toast('校验通过');return true}e.issues.innerHTML=list.slice(0,1000).map(x=>`<div class="issue" data-line="${x[0]}">第 ${x[0]} 行：${x[1]}</div>`).join('')+(list.length>1000?`<div class="issue">另有 ${list.length-1000} 个问题未展开</div>`:'');e.issues.className='issues show';e.issues.querySelectorAll('[data-line]').forEach(x=>x.onclick=()=>go(+x.dataset.line));toast(`发现 ${list.length} 个待检查项`);return false}
function copy(){navigator.clipboard.writeText(e.editor.value).then(()=>toast('已复制全文')).catch(()=>toast('复制失败'))}
function dismissKeyboard(){const a=document.activeElement;if(a&&typeof a.blur==='function')a.blur();e.editor.blur();e.search.blur();e.token.blur()}
function clearEditor(){if(!s.path){toast('请先加载文件');return}if(!e.editor.value.length){toast('编辑区已经为空');e.editor.focus();return}if(!confirm('确定清空当前编辑区？\n\n这只会清空当前页面内容，不会立即修改 GitHub。请粘贴新内容后再点击“保存到 GitHub”。'))return;e.editor.value='';e.issues.className='issues';refresh();e.editor.focus();e.editor.setSelectionRange(0,0);toast('已清空，请粘贴新内容')}
function replaceMeta(){if(!s.path){toast('请先加载文件');return}if(!e.editor.value.length){toast('编辑区为空，无法替换');return}let v=text(e.editor.value),n=0;const author=/^\s*#\s*AUTHOR\s*:.*$/im,repoLine=/^\s*#\s*REPO\s*:.*$/im,hasAuthor=author.test(v),hasRepo=repoLine.test(v),owner=s.loadedRepo.split('/')[0];if(hasAuthor){v=v.replace(author,`# AUTHOR: ${owner}`);n++}if(hasRepo){v=v.replace(repoLine,`# REPO: https://github.com/${s.loadedRepo}`);n++}if(!n){toast('未找到 AUTHOR: 或 REPO:');return}e.editor.value=v;e.issues.className='issues';refresh();const missing=[];if(!hasAuthor)missing.push('AUTHOR');if(!hasRepo)missing.push('REPO');toast(missing.length?`已替换 ${n} 项；未找到 ${missing.join('、')}`:'已替换 AUTHOR 和 REPO')}
function download(){const name=s.path?s.path.split('/').pop():'QuantumultX.list',u=URL.createObjectURL(new Blob([text(e.editor.value)],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function find(){const q=e.search.value.trim();if(!q)return;const all=e.editor.value.toLowerCase(),n=q.toLowerCase();let at=all.indexOf(n,Math.max(0,e.editor.selectionEnd||s.find));if(at<0)at=all.indexOf(n);if(at<0){toast('未找到');return}e.editor.focus();e.editor.setSelectionRange(at,at+q.length);s.find=at+q.length}
function add(){if(!s.path){toast('请先加载文件');return}const t=(prompt('规则类型','HOST')||'').trim().toUpperCase(),v=(prompt('匹配内容','apps.apple.com')||'').trim(),p=(prompt('策略组 / 动作','Apple')||'').trim();if(!t||!v||!p)return;e.editor.value=e.editor.value.replace(/\s*$/,'')+(e.editor.value.trim()?'\n':'')+`${t},${v},${p}\n`;refresh()}
function openGit(){if(!s.path){toast('请先选择文件');return}location.href=`https://github.com/${s.loadedRepo}/blob/${encodeURIComponent(s.loadedBranch)}/${safe(s.path)}`}
function saveErrorMessage(x){if(x&&x.status===401)return'保存失败：令牌无效或已过期，请重新授权。';if(x&&x.status===403)return'保存失败：令牌可能缺少 Contents：Read and write 权限。';if(x&&x.status===409)return'保存失败：GitHub 返回冲突，请重新加载后再试。';if(x&&x.status===422)return`保存失败：${s.loadedBranch||'目标'} 分支可能已变化，请重新加载后再试。`;return`保存失败：${x?.message||'未知错误'}`}
async function saveGitHub(){
if(s.saveBusy)return;
dismissKeyboard();
await new Promise(resolve=>setTimeout(resolve,80));
if(repo()!==s.loadedRepo||branch()!==s.loadedBranch){alert('仓库或分支已更改，请先重新读取规则文件。');return}
if(!s.token||s.authRepo!==s.loadedRepo){alert('请先为当前目标仓库完成 GitHub 授权。');return}
if(!s.path||!/\.list$/i.test(s.path)||!s.files.some(f=>f.path===s.path)){alert('安全限制：只能保存仓库中已扫描到的 .list 文件。');return}
const body=text(e.editor.value);
if(!body.length){alert('内容为空，本次保存已拒绝！');return}
if(body===s.original){toast('没有需要保存的修改');return}
if(!s.loadedSha){alert('当前文件缺少加载时 SHA，请重新读取规则文件后再保存。');return}
const c=count(body),size=bytes(body),target=`${s.loadedRepo}@${s.loadedBranch}`,defaultMsg=`Update ${s.path.split('/').pop()}`;
if(!confirm(`即将直接保存到 GitHub\n\n仓库：${target}\n文件：${s.path}\n规则：${c.TOTAL}\n大小：${mb(size)}\n\n保存前会再次检查文件 SHA；若远端已变化将拒绝覆盖。`))return;
const message=(prompt('Commit message',defaultMsg)||'').trim();if(!message)return;
s.saveBusy=true;updateSaveButton();e.editor.disabled=true;e.dirty.textContent='正在保存…';status(`正在保存 ${target}/${s.path} · ${mb(size)}`);
try{
const refPath=safe(`heads/${s.loadedBranch}`),ref=await jsonFetch(api(`git/ref/${refPath}`)),headSha=String(ref?.object?.sha||'');
if(!headSha)throw new Error(`无法读取 ${s.loadedBranch} 当前 HEAD`);
const meta=await jsonFetch(api(`contents/${safe(s.path)}?ref=${encodeURIComponent(s.loadedBranch)}`)),remoteSha=String(meta?.sha||'');
if(!remoteSha)throw new Error('无法读取当前文件 SHA');
if(remoteSha!==s.loadedSha){e.dirty.textContent='保存冲突';status('保存冲突：文件在你编辑期间已发生变化','#b42318');alert('保存已停止：GitHub 上的这个文件在你编辑期间已经发生变化。\n\n为防止覆盖其他修改，请重新加载最新版本后再编辑。');return}
const currentCommit=await jsonFetch(api(`git/commits/${headSha}`)),baseTree=String(currentCommit?.tree?.sha||'');
if(!baseTree)throw new Error(`无法读取 ${s.loadedBranch} 当前 Tree`);
const blob=await jsonWrite(api('git/blobs'),'POST',{content:body,encoding:'utf-8'});if(!blob?.sha)throw new Error('GitHub 未返回新 Blob SHA');
const tree=await jsonWrite(api('git/trees'),'POST',{base_tree:baseTree,tree:[{path:s.path,mode:s.loadedMode||'100644',type:'blob',sha:blob.sha}]});if(!tree?.sha)throw new Error('GitHub 未返回新 Tree SHA');
const commit=await jsonWrite(api('git/commits'),'POST',{message,tree:tree.sha,parents:[headSha]});if(!commit?.sha)throw new Error('GitHub 未返回新 Commit SHA');
const refNow=await jsonFetch(api(`git/ref/${refPath}`)),headNow=String(refNow?.object?.sha||'');
if(headNow!==headSha){e.dirty.textContent='保存冲突';status(`保存冲突：${s.loadedBranch} 在保存过程中发生变化`,'#b42318');alert(`保存已停止：${s.loadedBranch} 分支在本次保存过程中发生了新的提交。\n\n没有强制覆盖。请重新加载后再保存。`);return}
await jsonWrite(api(`git/refs/${refPath}`),'PATCH',{sha:commit.sha,force:false});
s.original=body;s.loadedSha=String(blob.sha);s.lastSavedSha=String(commit.sha);const f=s.files.find(x=>x.path===s.path);if(f){f.sha=s.loadedSha;f.size=size}e.dirty.textContent='已保存到 GitHub';status(`已保存到 ${target} · ${commit.sha.slice(0,7)} · ${c.TOTAL} 条规则 · ${mb(size)}`,'#0d7a37');toast('已保存到 GitHub')
}catch(x){if(e.dirty.textContent!=='保存冲突')e.dirty.textContent='保存失败';status(saveErrorMessage(x),'#b42318');alert(saveErrorMessage(x))}finally{s.saveBusy=false;e.editor.disabled=false;updateSaveButton()}
}
function targetChanged(){e.authDetail.textContent=s.token&&s.authRepo===repo()?`已验证 ${s.authRepo}；保存时会实际验证 Contents 写权限。`:`目标仓库：${repo()||'未填写'}。读取公开仓库无需令牌；私有仓库及保存需要授权。`;status('仓库或分支已更改，请点击“读取规则文件”');updateSaveButton()}
async function selectRepository(){const option=e.repoSelect.selectedOptions[0];if(!option||!option.value)return;e.repo.value=option.value;e.branch.value=option.dataset.branch||'';targetChanged();await read()}
e.read.onclick=read;e.refreshRepos.onclick=loadRepositories;e.repoSelect.onchange=selectRepository;e.auth.onclick=async()=>{await verifyAuth();if(s.token)await loadRepositories()};e.logout.onclick=clearAuth;e.token.onkeydown=x=>{if(x.key==='Enter')e.auth.onclick()};e.repo.oninput=targetChanged;e.branch.oninput=targetChanged;e.repo.onkeydown=e.branch.onkeydown=x=>{if(x.key==='Enter')read()};e.format.onclick=format;e.dedupe.onclick=dedupe;e.header.onclick=head;e.check.onclick=check;e.copy.onclick=copy;e.clear.onclick=clearEditor;e.replaceMeta.onclick=replaceMeta;e.download.onclick=download;e.find.onclick=find;e.add.onclick=add;e.open.onclick=openGit;e.save.onclick=saveGitHub;e.editor.oninput=scheduleRefresh;e.search.onkeydown=x=>{if(x.key==='Enter')find()};window.onbeforeunload=x=>{if(s.path&&e.editor.value!==s.original){x.preventDefault();x.returnValue=''}};refresh();renderRepositories();loadRepositories()
})();
