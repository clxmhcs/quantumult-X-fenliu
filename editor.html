<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantumult X List 编辑器</title>
<style>
body{margin:0;background:#f5f7fa;color:#17212f;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:1200px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:12px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:260px 1fr;gap:12px}.files{max-height:420px;overflow:auto;display:grid;gap:5px}.file,.btn{border:1px solid #dfe4ea;border-radius:8px;background:#fff;color:#17212f;padding:8px 10px}.file{text-align:left;overflow-wrap:anywhere}.file.active{border-color:#0969da;background:#eaf3ff}.btn.primary{background:#0969da;color:#fff;border-color:#0969da}.btn:disabled{opacity:.55;cursor:not-allowed}input{border:1px solid #dfe4ea;border-radius:8px;padding:8px 10px}textarea{width:100%;min-height:560px;resize:vertical;border:1px solid #dfe4ea;border-radius:10px;padding:10px;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}.muted{color:#667085}.auth-note{margin:8px 0}.auth-token{flex:1;min-width:260px}.auth-ok{color:#0d7a37}.auth-bad{color:#b42318}.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.stat{border:1px solid #dfe4ea;border-radius:8px;padding:8px}.stat b{font-size:18px;display:block}.issues{display:none;max-height:160px;overflow:auto}.issues.show{display:block}.issue{background:#fff0ef;margin:4px 0;padding:6px 8px;border-radius:7px;font:12px ui-monospace,monospace}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);opacity:0;background:#17212f;color:#fff;border-radius:999px;padding:10px 14px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.grid{grid-template-columns:1fr}textarea{min-height:430px}.auth-token{min-width:100%}}
</style>
</head>
<body>
<main class="app">
<h1>Quantumult X List 编辑器</h1>
<p class="muted">读取、修改、校验和导出当前仓库中的 .list 分流规则。</p>
<div class="card row"><label>仓库 <input id="repo" value="clxmhcs/quantumult-X-fenliu"></label><label>分支 <input id="branch" value="main"></label><button id="read" class="btn primary">读取规则文件</button><span id="status" class="muted"></span></div>
<div class="card">
<div class="row"><b>GitHub 授权</b><span id="authStatus" class="muted">未授权</span></div>
<p class="muted auth-note">用于后续“直接保存到 GitHub”。令牌只保存在当前网页的 JavaScript 内存中，不写入 localStorage、sessionStorage、Cookie、URL 或仓库；刷新或关闭页面后需要重新授权。</p>
<div class="row"><input id="token" class="auth-token" type="password" placeholder="Fine-grained PAT（github_pat_…）" autocomplete="off" autocapitalize="none" spellcheck="false"><button id="auth" class="btn primary">验证授权</button><button id="logout" class="btn" disabled>清除授权</button></div>
<div id="authDetail" class="muted" style="margin-top:8px">目标仓库：clxmhcs/quantumult-X-fenliu。建议令牌仅授权此仓库，并设置 Contents：Read and write。</div>
</div>
<section class="grid"><aside class="card"><h3>规则文件</h3><div id="files" class="files"><span class="muted">点击读取规则文件</span></div><div id="stats" class="stats"></div></aside><section class="card"><div class="row"><b id="path">尚未选择文件</b><span id="dirty" class="muted">未加载</span></div><div class="row" style="margin:10px 0"><input id="search" placeholder="查找域名、策略或规则" style="flex:1"><button id="find" class="btn">下一个</button><button id="add" class="btn">新增规则</button><button id="format" class="btn">整理格式</button><button id="dedupe" class="btn">规则去重</button><button id="header" class="btn">更新统计</button><button id="check" class="btn">校验</button><button id="copy" class="btn">复制全文</button><button id="download" class="btn">下载</button><button id="open" class="btn primary">GitHub编辑</button></div><textarea id="editor" disabled spellcheck="false" wrap="off"></textarea><div id="issues" class="issues"></div></section></section>
</main><div id="toast" class="toast"></div>
<script>
(()=>{
const LOCK_REPO='clxmhcs/quantumult-X-fenliu',LOCK_BRANCH='main';
const $=id=>document.getElementById(id),e={repo:$('repo'),branch:$('branch'),read:$('read'),status:$('status'),authStatus:$('authStatus'),authDetail:$('authDetail'),token:$('token'),auth:$('auth'),logout:$('logout'),files:$('files'),stats:$('stats'),path:$('path'),dirty:$('dirty'),search:$('search'),find:$('find'),add:$('add'),format:$('format'),dedupe:$('dedupe'),header:$('header'),check:$('check'),copy:$('copy'),download:$('download'),open:$('open'),editor:$('editor'),issues:$('issues'),toast:$('toast')},s={files:[],path:'',original:'',find:0,timer:0,refreshTimer:0,token:'',login:'',authBusy:false};
const known=new Set(['HOST','HOST-SUFFIX','HOST-KEYWORD','HOST-WILDCARD','IP-ASN','IP-CIDR','IP6-CIDR','GEOIP','USER-AGENT','URL-REGEX','PROCESS-NAME','PROCESS-PATH','FINAL','AND','OR','NOT']),heads=new Set(['HOST','HOST-SUFFIX','HOST-KEYWORD','HOST-WILDCARD','IP-ASN','IP-CIDR','IP6-CIDR','GEOIP','USER-AGENT','TOTAL']),shown=['TOTAL','HOST','HOST-SUFFIX','HOST-KEYWORD','HOST-WILDCARD','IP-ASN','IP-CIDR','IP6-CIDR','GEOIP','USER-AGENT'];
const text=v=>String(v||'').replace(/\r\n/g,'\n'),repo=()=>e.repo.value.trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\/$/,''),branch=()=>e.branch.value.trim()||'main',api=p=>`https://api.github.com/repos/${repo()}/${p}`,safe=p=>p.split('/').map(encodeURIComponent).join('/'),rule=l=>l.trim()&&!l.trimStart().startsWith('#'),parts=l=>l.split(',').map(x=>x.trim()),mb=n=>(Number(n||0)/1048576).toFixed(2)+' MB';
function toast(v){clearTimeout(s.timer);e.toast.textContent=v;e.toast.className='toast show';s.timer=setTimeout(()=>e.toast.className='toast',3000)}
function status(v,k){e.status.textContent=v;e.status.style.color=k||'#667085'}
function setAuth(ok,title,detail){e.authStatus.textContent=title;e.authStatus.className=ok?'auth-ok':'auth-bad';e.authDetail.textContent=detail;e.logout.disabled=!ok}
function decode(v){const x=atob(v.replace(/\n/g,''));return new TextDecoder().decode(Uint8Array.from(x,c=>c.charCodeAt(0)))}
function ghHeaders(token=s.token,accept='application/vnd.github+json'){const h={Accept:accept,'X-GitHub-Api-Version':'2022-11-28'};if(token)h.Authorization=`Bearer ${token}`;return h}
async function jsonFetch(u,token=s.token,accept='application/vnd.github+json'){const r=await fetch(u,{headers:ghHeaders(token,accept),cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||`请求失败 ${r.status}`);return d}
async function textFetch(u,token=s.token,accept='text/plain'){const r=await fetch(u,{headers:ghHeaders(token,accept),cache:'no-store'}),body=await r.text();if(!r.ok){let msg='';try{msg=JSON.parse(body).message||''}catch{}throw new Error(msg||`请求失败 ${r.status}`)}return body}
async function req(u){return await jsonFetch(u)}
async function raw(p){if(s.token){return await textFetch(api(`contents/${safe(p)}?ref=${encodeURIComponent(branch())}`),s.token,'application/vnd.github.raw+json')}const u=`https://raw.githubusercontent.com/${repo()}/${encodeURIComponent(branch())}/${safe(p)}`,r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`读取原始文件失败 ${r.status}`);return await r.text()}
async function verifyAuth(){if(s.authBusy)return;const token=e.token.value.trim();if(!token){setAuth(false,'未授权','请输入 Fine-grained personal access token。');e.token.focus();return}s.authBusy=true;e.auth.disabled=true;e.logout.disabled=true;setAuth(false,'正在验证…','正在验证 GitHub 身份和目标仓库读取权限。');try{const user=await jsonFetch('https://api.github.com/user',token),login=String(user.login||'');if(!login)throw new Error('无法确认 GitHub 登录身份');if(login.toLowerCase()!==LOCK_REPO.split('/')[0].toLowerCase())throw new Error(`当前令牌属于 ${login}，本编辑器仅接受 ${LOCK_REPO.split('/')[0]} 的令牌`);const file=await jsonFetch(`https://api.github.com/repos/${LOCK_REPO}/contents/editor.html?ref=${LOCK_BRANCH}`,token);if(!file||!file.sha)throw new Error('令牌无法读取目标仓库内容');s.token=token;s.login=login;e.token.value='';setAuth(true,`已授权 ${login}`,'身份与 Contents 读取权限验证成功；令牌仅保存在当前页面内存。第 2 步实现直接保存时会实际使用并校验写权限。');toast('GitHub 授权成功')}catch(x){s.token='';s.login='';setAuth(false,'授权失败',x.message||'GitHub 授权失败');toast('GitHub 授权失败')}finally{s.authBusy=false;e.auth.disabled=false;e.logout.disabled=!s.token}}
function clearAuth(){s.token='';s.login='';e.token.value='';setAuth(false,'未授权',`目标仓库：${LOCK_REPO}。建议令牌仅授权此仓库，并设置 Contents：Read and write。`);toast('已清除 GitHub 授权')}
function count(v){const c={TOTAL:0};for(const l of text(v).split('\n')){if(!rule(l))continue;const t=(parts(l)[0]||'').toUpperCase();c[t]=(c[t]||0)+1;c.TOTAL++}return c}
function refreshStats(){const c=count(e.editor.value);e.stats.innerHTML=shown.filter(k=>c[k]||k==='TOTAL').map(k=>`<div class="stat"><b>${c[k]||0}</b><span>${k}</span></div>`).join('');return c}
function refresh(){refreshStats();e.dirty.textContent=!s.path?'未加载':e.editor.value===s.original?'已同步':'有未保存修改'}
function scheduleRefresh(){e.dirty.textContent=!s.path?'未加载':e.editor.value===s.original?'已同步':'有未保存修改';clearTimeout(s.refreshTimer);s.refreshTimer=setTimeout(refreshStats,250)}
function norm(l){return rule(l)?parts(l).join(','):l.replace(/[ \t]+$/g,'')}
function render(){if(!s.files.length){e.files.innerHTML='<span class="muted">未找到 .list 文件</span>';return}e.files.innerHTML='';for(const f of s.files){const b=document.createElement('button');b.className='file'+(f.path===s.path?' active':'');b.textContent=f.path;b.onclick=()=>load(f.path);e.files.appendChild(b)}}
async function read(){if(!/^[^/\s]+\/[^/\s]+$/.test(repo())){status('仓库格式应为 用户名/仓库名','#b42318');return}status('正在读取...');try{const d=await req(api(`git/trees/${encodeURIComponent(branch())}?recursive=1`));s.files=(d.tree||[]).filter(x=>x.type==='blob'&&/\.list$/i.test(x.path)).sort((a,b)=>a.path.localeCompare(b.path,'zh-CN'));render();status(`找到 ${s.files.length} 个 .list 文件${s.token?` · 已授权 ${s.login}`:''}`,'#0d7a37');if(s.files.length){const f=s.files.find(x=>/(^|\/)Apple\.list$/i.test(x.path))||s.files[0];load(f.path)}}catch(x){status(x.message,'#b42318')}}
async function load(p){if(s.path&&e.editor.value!==s.original&&!confirm('当前文件有未保存修改。仍然切换吗？'))return;const f=s.files.find(x=>x.path===p),size=Number(f?.size||0),large=size>=1000000;status(`正在读取 ${p}${size?` · ${mb(size)}`:''}${large?' · 大文件模式':''}`);try{let body='';if(large){body=await raw(p)}else{const d=await req(api(`contents/${safe(p)}?ref=${encodeURIComponent(branch())}`));if(d.content&&String(d.encoding||'base64').toLowerCase()==='base64')body=decode(d.content);else body=await raw(p)}if(size>0&&!body.length)throw new Error('读取失败：GitHub 未返回文件正文');s.path=p;s.original=text(body);e.editor.value=s.original;e.editor.disabled=false;e.path.textContent=p;e.issues.className='issues';render();const c=refreshStats();e.dirty.textContent='已同步';status(`文件已加载 · ${c.TOTAL} 条规则${size?` · ${mb(size)}`:''}${large?' · 大文件模式':''}${s.token?` · 已授权 ${s.login}`:''}`,'#0d7a37')}catch(x){status(x.message,'#b42318')}}
function dt(){const d=new Date(),p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
function format(){const end=/\n$/.test(e.editor.value);let v=text(e.editor.value).split('\n').map(norm).join('\n');if(!end)v=v.replace(/\n$/,'');e.editor.value=v;refresh();toast('已整理格式')}
function dedupe(){const seen=new Set();let n=0;e.editor.value=text(e.editor.value).split('\n').filter(l=>{if(!rule(l))return true;const k=norm(l);if(seen.has(k)){n++;return false}seen.add(k);return true}).join('\n');refresh();toast(n?`已移除 ${n} 条重复规则`:'没有完全重复规则')}
function head(){const c=count(e.editor.value);let hit=false;e.editor.value=text(e.editor.value).split('\n').map(l=>{let m=l.match(/^(#\s*UPDATED\s*:\s*).*/i);if(m){hit=true;return m[1]+dt()}m=l.match(/^#\s*([A-Z0-9-]+)\s*:\s*\d+\s*$/i);if(m&&heads.has(m[1].toUpperCase())){hit=true;const n=m[1].toUpperCase();return `# ${n}: ${c[n]||0}`}return l}).join('\n');refresh();toast(hit?'已更新统计':'没有可更新的统计头部')}
function go(n){const a=e.editor.value.split('\n'),st=a.slice(0,Math.max(0,n-1)).join('\n').length+(n>1?1:0);e.editor.focus();e.editor.setSelectionRange(st,st+(a[n-1]||'').length)}
function check(){const list=[];text(e.editor.value).split('\n').forEach((l,i)=>{if(!rule(l))return;const p=parts(l),t=(p[0]||'').toUpperCase();if(!known.has(t))list.push([i+1,`未识别类型 ${t||'(空)'}`]);if(p.length<2||!p[1])list.push([i+1,'缺少匹配内容或策略']);if(t!=='FINAL'&&p.length<3)list.push([i+1,'缺少策略组 / 动作'])});if(!list.length){e.issues.innerHTML='<div class="issue">校验通过</div>';e.issues.className='issues show';toast('校验通过');return}e.issues.innerHTML=list.map(x=>`<div class="issue" data-line="${x[0]}">第 ${x[0]} 行：${x[1]}</div>`).join('');e.issues.className='issues show';e.issues.querySelectorAll('[data-line]').forEach(x=>x.onclick=()=>go(+x.dataset.line));toast(`发现 ${list.length} 个待检查项`)}
function copy(){navigator.clipboard.writeText(e.editor.value).then(()=>toast('已复制全文'))}
function download(){const name=s.path?s.path.split('/').pop():'QuantumultX.list',u=URL.createObjectURL(new Blob([text(e.editor.value)],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function find(){const q=e.search.value.trim();if(!q)return;const all=e.editor.value.toLowerCase(),n=q.toLowerCase();let at=all.indexOf(n,Math.max(0,e.editor.selectionEnd||s.find));if(at<0)at=all.indexOf(n);if(at<0){toast('未找到');return}e.editor.focus();e.editor.setSelectionRange(at,at+q.length);s.find=at+q.length}
function add(){if(!s.path){toast('请先加载文件');return}const t=(prompt('规则类型','HOST')||'').trim().toUpperCase(),v=(prompt('匹配内容','apps.apple.com')||'').trim(),p=(prompt('策略组 / 动作','Apple')||'').trim();if(!t||!v||!p)return;e.editor.value=e.editor.value.replace(/\s*$/,'')+(e.editor.value.trim()?'\n':'')+`${t},${v},${p}\n`;refresh()}
function openGit(){if(!s.path){toast('请先选择文件');return}location.href=`https://github.com/${repo()}/edit/${branch()}/${safe(s.path)}`}
e.read.onclick=read;e.auth.onclick=verifyAuth;e.logout.onclick=clearAuth;e.token.onkeydown=x=>{if(x.key==='Enter')verifyAuth()};e.format.onclick=format;e.dedupe.onclick=dedupe;e.header.onclick=head;e.check.onclick=check;e.copy.onclick=copy;e.download.onclick=download;e.find.onclick=find;e.add.onclick=add;e.open.onclick=openGit;e.editor.oninput=scheduleRefresh;e.search.onkeydown=x=>{if(x.key==='Enter')find()};refresh()
})();
</script>
</body>
</html>
